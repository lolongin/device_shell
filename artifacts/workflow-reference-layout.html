<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workflow 编辑器排版示例</title>
<style>
:root{--bg:#f6f7fb;--surface:#fff;--line:#e6e8ef;--text:#22252d;--muted:#7c8290;--blue:#4057d6;--blue-soft:#eef1ff;--green:#2b9a72;--shadow:0 8px 24px #26304a12}*{box-sizing:border-box}body{margin:0;color:var(--text);font:13px Inter,'Microsoft YaHei',sans-serif;background:var(--bg)}button,input,select{font:inherit;color:inherit}button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 11px;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #91a0ff;outline-offset:2px}.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--line);background:var(--surface)}.brand{font-weight:700}.crumb{color:var(--muted);margin-left:16px}.top-actions{display:flex;gap:8px}.primary{color:#fff;background:var(--blue);border-color:var(--blue)}.app{display:grid;grid-template-columns:178px minmax(430px,1fr) minmax(540px,1.08fr);height:calc(100vh - 58px)}.sidebar{border-right:1px solid var(--line);background:#fbfbfd;padding:18px 12px}.sidebar h3{font-size:11px;color:var(--muted);font-weight:600;margin:2px 9px 13px}.side-item{width:100%;border-color:transparent;text-align:left;background:transparent;margin:2px 0;display:block}.side-item.active{background:var(--blue-soft);color:var(--blue)}.side-item small{display:block;color:var(--muted);margin-top:5px}.center{position:relative;overflow:auto;background:#f1f2f7;background-image:radial-gradient(#d9dce5 1px,transparent 1px);background-size:20px 20px;padding:42px 28px}.canvas-tools{position:absolute;top:14px;right:16px;display:flex;gap:5px}.canvas-tools button{padding:5px 8px;font-size:12px}.flow{width:270px;margin:24px auto}.node{position:relative;background:#fff;border:1px solid #dfe2eb;border-radius:7px;padding:14px 16px;box-shadow:0 3px 8px #26304a0b}.node strong{display:block;font-size:13px;margin-bottom:7px}.node small{color:var(--muted);line-height:1.6}.node.selected{border:2px solid var(--blue);padding:13px 15px;box-shadow:0 0 0 4px #4057d615}.node.selected:before{content:'编辑中';position:absolute;top:-25px;right:0;color:var(--blue);font-size:11px}.connector{height:42px;position:relative}.connector:before{content:'';position:absolute;left:50%;top:0;width:1px;height:100%;background:#aeb4c2}.plus{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:22px;height:22px;padding:0;border-radius:50%;color:var(--blue);background:#fff}.right{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.editor-head{padding:20px 24px 16px;border-bottom:1px solid var(--line)}.eyebrow{font-size:11px;color:var(--muted)}h1{font-size:19px;margin:7px 0}.step-meta{display:flex;gap:7px;color:var(--muted);font-size:12px}.tabs{display:flex;gap:26px;padding:0 24px;border-bottom:1px solid var(--line)}.tabs button{border:0;border-radius:0;padding:14px 0;color:var(--muted);background:transparent}.tabs button.active{color:var(--blue);box-shadow:inset 0 -2px var(--blue)}.editor{display:grid;grid-template-columns:minmax(300px,1fr) 215px;min-height:0;flex:1}.form{padding:22px 24px;overflow:auto}.field{margin-bottom:20px}.field-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.field-head label{font-weight:600}.required{font-size:11px;color:#bd7b16}.hint{font-size:11px;color:var(--muted);line-height:1.5;margin-top:6px}input,select{width:100%;height:36px;border:1px solid #dfe2e9;border-radius:6px;background:#fff;padding:0 10px}.mode{display:flex;gap:4px;margin-bottom:8px}.mode button{font-size:11px;padding:5px 9px;color:var(--muted)}.mode .active{background:var(--blue-soft);border-color:#bdc6ff;color:var(--blue)}.reference{display:flex;align-items:center;justify-content:space-between;text-align:left;width:100%;padding:9px 10px;background:#fafbff;border-color:#b9c2fa}.reference strong{font-weight:500;display:block}.reference small{display:block;color:var(--muted);margin-top:4px}.section{border-top:1px solid var(--line);padding:17px 0}.section summary{cursor:pointer;font-weight:600}.section-content{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.sources{border-left:1px solid var(--line);padding:18px 16px;background:#fbfbfd;overflow:auto}.sources h3{font-size:12px;margin:0 0 13px}.search{margin-bottom:12px}.source-group{font-size:11px;color:var(--muted);font-weight:600;padding:10px 2px 5px}.source{width:100%;border:0;background:transparent;text-align:left;padding:9px 7px;border-radius:5px}.source:hover,.source.active{background:var(--blue-soft);color:var(--blue)}.source small{float:right;color:var(--muted);font-size:10px}.footer{padding:14px 24px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.ok{color:var(--green)}@media(max-width:1100px){.app{grid-template-columns:150px minmax(360px,1fr) 460px}.editor{grid-template-columns:1fr}.sources{display:none}}@media(max-width:750px){.app{display:block;height:auto}.sidebar{display:none}.center{min-height:500px}.right{border-left:0;border-top:1px solid var(--line)}.editor{display:block}.sources{display:block;border-left:0;border-top:1px solid var(--line)}.top{padding:0 12px}.crumb{display:none}}
</style>
</head>
<body>
<header class="top"><div><span class="brand">设备检查流程</span><span class="crumb">/ 草稿 / 编辑器</span></div><div class="top-actions"><button>撤销</button><button>重做</button><button class="primary" id="save">保存流程</button></div></header>
<main class="app">
<nav class="sidebar"><h3>流程步骤 · 4</h3><button class="side-item">01　流程输入<small>目标设备</small></button><button class="side-item">02　选择设备<small>使用流程输入</small></button><button class="side-item active">03　等待终端输出<small>等待匹配内容</small></button><button class="side-item">04　流程结果<small>输出执行结果</small></button></nav>
<section class="center"><div class="canvas-tools"><button>−</button><button>100%</button><button>＋</button><button>适应</button></div><div class="flow"><div class="node"><strong>流程输入</strong><small>目标设备 · device</small></div><div class="connector"><button class="plus">＋</button></div><div class="node"><strong>选择设备</strong><small>来源：流程输入 / 目标设备</small></div><div class="connector"><button class="plus">＋</button></div><div class="node selected"><strong>等待终端输出</strong><small>包含文本 · 引用匹配内容<br>超时 30 秒</small></div><div class="connector"><button class="plus">＋</button></div><div class="node"><strong>流程结果</strong><small>匹配状态、终端输出</small></div></div></section>
<section class="right"><div class="editor-head"><div class="eyebrow">步骤 03 · 终端操作</div><h1>等待终端输出</h1><div class="step-meta"><span>等待条件</span><span>·</span><span>可重试</span></div></div><div class="tabs"><button class="active" data-tab="inputs">步骤输入</button><button data-tab="test">测试步骤</button><button data-tab="settings">执行设置</button></div><div class="editor"><div class="form" id="inputs"><div class="field"><div class="field-head"><label>匹配内容 <span class="required">必填</span></label></div><div class="mode"><button class="active">引用</button><button>固定值</button></div><button class="reference" id="ref"><span><strong id="label">流程输入 / 匹配文本</strong><small id="value">${inputs.pattern}</small></span><span>⌄</span></button><p class="hint">选择流程输入或上游步骤输出。右侧列表可直接点击填入。</p></div><div class="section"><details open><summary>匹配规则</summary><div class="section-content"><div><div class="field-head"><label>匹配方式</label></div><select><option>包含文本</option><option>正则表达式</option></select></div><div><div class="field-head"><label>超时时间</label></div><input value="30 秒"></div></div></details></div><div class="section"><details><summary>失败处理与重试</summary><div class="section-content"><div><div class="field-head"><label>失败重试</label></div><input value="0 次"></div><div><div class="field-head"><label>失败后</label></div><select><option>停止流程</option><option>继续执行</option></select></div></div></details></div></div><aside class="sources"><h3>可用引用</h3><input class="search" id="search" placeholder="搜索参数或步骤"><div class="source-group">流程输入</div><button class="source" data-label="流程输入 / 匹配文本" data-value="${inputs.pattern}">匹配文本 <small>STRING</small></button><div class="source-group">选择设备 · 步骤 02</div><button class="source" data-label="选择设备 / 设备 ID" data-value="${select.device_id}">设备 ID <small>STRING</small></button><button class="source" data-label="选择设备 / 状态" data-value="${select.status}">状态 <small>STRING</small></button><div class="source-group">循环上下文</div><button class="source" data-label="当前循环 / 索引" data-value="${loop.index}">循环索引 <small>INTEGER</small></button></aside></div><div class="footer"><span class="ok" id="status">● 必填参数已设置</span><button class="primary" id="save2">保存步骤</button></div></section>
</main>
<script>
const form=document.querySelector('#inputs'),original=form.innerHTML;let inputMarkup=original;
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{const current=document.querySelector('[data-tab].active');if(current.dataset.tab==='inputs')inputMarkup=form.innerHTML;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));form.innerHTML=b.dataset.tab==='inputs'?inputMarkup:b.dataset.tab==='test'?'<h3>测试步骤</h3><p class="hint">示例未连接设备</p><button id="run">运行测试</button><p id="result"></p>':'<h3>执行设置</h3><div class="field"><div class="field-head"><label>失败重试次数</label></div><input type="number" min="0" value="0"></div><div class="field"><div class="field-head"><label>失败后</label></div><select><option>停止流程</option><option>继续执行</option></select></div>';const run=document.querySelector('#run');if(run)run.onclick=()=>document.querySelector('#result').textContent='模拟测试完成：匹配成功';});
document.querySelectorAll('.source').forEach(b=>b.onclick=()=>{if(!document.querySelector('#label'))document.querySelector('[data-tab="inputs"]').click();document.querySelector('#label').textContent=b.dataset.label;document.querySelector('#value').textContent=b.dataset.value;document.querySelectorAll('.source').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelector('#status').textContent='● 已更新引用'});
document.querySelector('#search').oninput=e=>document.querySelectorAll('.source').forEach(b=>b.hidden=!b.textContent.toLowerCase().includes(e.target.value.toLowerCase()));
document.querySelectorAll('#save,#save2').forEach(b=>b.onclick=()=>{b.textContent='已保存';setTimeout(()=>b.textContent='保存'+(b.id==='save2'?'步骤':'流程'),1200)});
</script>
</body></html>
