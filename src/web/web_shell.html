<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <link rel="stylesheet" href="assets/workspace-theme.css" />
  <title>Device Workspace</title>
  <style>
    .shell {
      height: 100vh;
      min-height: 0;
      display: grid;
      grid-template-rows: auto auto auto minmax(0, 1fr);
      background:
        radial-gradient(circle at 10% 0, var(--home-glow-accent), transparent 32%),
        radial-gradient(circle at 95% 5%, var(--home-glow-blue), transparent 34%),
        var(--bg);
    }

    .top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      background: var(--surface-top);
    }

    .eyebrow {
      color: var(--accent);
      font: 800 10px/1.2 "Cascadia Mono", Consolas, monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .title { margin-top: 3px; font-size: 19px; font-weight: 800; }
    .subtitle { margin-top: 4px; color: var(--muted); line-height: 1.35; }
    .top-actions { display: flex; align-items: center; gap: 8px; }

    .filterbar {
      display: grid;
      grid-template-columns: minmax(220px, 1.6fr) minmax(130px, 0.8fr) minmax(130px, 0.8fr) 92px auto auto;
      gap: 8px;
      align-items: center;
      padding: 10px 16px;
      border-bottom: 1px solid var(--line);
      background: var(--surface-filter);
    }

    .filter-chips {
      min-height: 35px;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 16px;
      border-bottom: 1px solid var(--line);
      background: var(--surface-filter);
      overflow: auto;
    }

    .filter-chip,
    .tree-node,
    .inline-action,
    .context-action {
      cursor: pointer;
    }

    .filter-chip {
      height: 24px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 220px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: var(--input);
      white-space: nowrap;
    }

    .filter-chip:hover {
      color: var(--text);
      border-color: var(--blue);
      background: var(--panel-2);
    }

    .filter-chip b {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }

    .content {
      min-height: 0;
      display: grid;
      grid-template-columns: 230px minmax(480px, 1fr) 330px;
      gap: 10px;
      padding: 10px;
      overflow: hidden;
    }

    .panel,
    .card {
      min-height: 0;
      border: 1px solid var(--line);
      background: var(--surface-card);
      border-radius: 12px;
      overflow: hidden;
    }

    .panel,
    .tree-panel,
    .context-panel {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .context-panel {
      align-content: start;
    }

    .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-2);
    }

    .head-title { font-weight: 800; color: var(--text); }
    .head-sub { margin-top: 2px; color: var(--muted); font-size: 12px; }
    .body { min-height: 0; padding: 12px; overflow: auto; }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      color: var(--muted);
      line-height: 1.35;
      justify-content: flex-end;
      transition: opacity 140ms ease, transform 140ms ease;
    }

    .stats b { color: var(--text); font-weight: 800; }
    .idle { color: var(--accent); }
    .occupied { color: var(--warn); }
    .pipeline { color: var(--blue); }
    .other { color: var(--soft); }

    .tree {
      min-height: 0;
      overflow: auto;
      display: grid;
      align-content: start;
      gap: 5px;
      padding: 8px;
    }

    .tree-root {
      padding: 7px 8px;
      color: var(--text);
      font-weight: 800;
    }

    .tree-node {
      min-width: 0;
      display: grid;
      grid-template-columns: 16px minmax(0, 1fr) auto;
      align-items: center;
      gap: 6px;
      min-height: 30px;
      padding: 5px 8px;
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--muted);
      background: transparent;
      text-align: left;
    }

    .tree-node:hover,
    .tree-node.active {
      color: var(--text);
      border-color: var(--success-line);
      background: var(--success-soft);
    }

    .tree-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      justify-self: center;
    }

    .tree-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tree-count {
      color: var(--soft);
      font: 700 11px/1 "Cascadia Mono", Consolas, monospace;
    }

    .table {
      min-height: 0;
      display: grid;
      grid-template-rows: 30px minmax(0, 1fr);
      background: var(--bg);
    }

    .thead,
    .row {
      display: grid;
      grid-template-columns: 72px minmax(170px, 1.5fr) minmax(116px, 0.9fr) 72px 78px 118px 168px;
      align-items: center;
    }

    .thead {
      padding-right: 10px;
      font-size: 12px;
      font-weight: 700;
    }

    .tbody {
      position: relative;
      min-height: 0;
      overflow: auto;
      transition: opacity 140ms ease;
      scrollbar-gutter: stable;
    }

    .tbody.filtering {
      opacity: 0.68;
    }

    .cell {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 0 9px;
    }

    .row {
      min-height: 40px;
      cursor: pointer;
      transition:
        background-color 140ms ease,
        border-color 140ms ease,
        opacity 140ms ease,
        transform 140ms ease;
    }

    .row.entering,
    .device-panel-frame.entering,
    .session.entering {
      animation: content-enter 150ms ease both;
    }

    .row.group {
      min-height: 28px;
      color: var(--soft);
      background: var(--input);
    }

    .row:hover,
    .row.selected {
      background: var(--panel-2);
    }

    .status {
      font-weight: 800;
    }

    .row-actions {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 5px;
      padding-right: 8px;
    }

    .inline-action {
      min-width: 42px;
      height: 24px;
      padding: 0 8px;
      border-radius: 7px;
      font-size: 12px;
    }

    .inline-action:disabled {
      opacity: 0.42;
      cursor: default;
    }

    .device-panel-frame {
      will-change: opacity, transform;
    }

    .device-name {
      font-size: 18px;
      font-weight: 800;
      line-height: 1.3;
    }

    .meta {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      max-width: 190px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 12px;
    }

    .kv {
      display: grid;
      grid-template-columns: 76px minmax(0, 1fr);
      gap: 7px;
      line-height: 1.75;
      margin-top: 12px;
    }

    .key { color: var(--soft); }
    .value { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }

    .context-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .sessions {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .session {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      border: 1px solid var(--line);
      background: var(--input);
      border-radius: 9px;
      padding: 8px 9px;
      cursor: pointer;
      transition: background-color 140ms ease, border-color 140ms ease, opacity 140ms ease, transform 140ms ease;
    }

    .session:hover,
    .session.active {
      border-color: var(--success-line);
      background: var(--success-soft);
    }

    .session-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 700;
    }

    .session-sub {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .session-status { font-weight: 800; color: var(--muted); }
    .session-status.connected { color: var(--accent); }
    .session-status.connecting { color: var(--blue); }
    .session-status.disconnected { color: var(--danger); }
    .empty { line-height: 1.6; padding: 14px 10px; color: var(--muted); }

    @keyframes content-enter {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 1220px) {
      .content {
        grid-template-columns: 210px minmax(420px, 1fr);
        overflow: auto;
      }
      .context-panel {
        grid-column: 1 / -1;
        min-height: 260px;
      }
    }

    @media (max-width: 840px) {
      .filterbar { grid-template-columns: 1fr 1fr; }
      .content { grid-template-columns: 1fr; }
      .tree-panel { min-height: 230px; }
      .thead,
      .row { grid-template-columns: 60px minmax(150px, 1.4fr) 92px 62px 66px 104px 144px; }
    }
  </style>
</head>
<body class="workspace-page">
  <main class="shell">
    <header class="top">
      <div>
        <div class="eyebrow">Device Operations</div>
        <div class="title">设备工作台</div>
        <div class="subtitle" id="summary">当前显示全部设备</div>
      </div>
      <div class="top-actions">
        <button class="primary" id="sessionsWorkspace" type="button">终端会话 (0)</button>
        <button id="refresh" type="button">刷新</button>
      </div>
    </header>

    <section class="filterbar">
      <input id="search" autocomplete="off" placeholder="搜索名称、ID、板卡、型号、IP" />
      <select id="domain"></select>
      <select id="status"></select>
      <input id="cpu" autocomplete="off" placeholder="CPU" />
      <button id="mine" type="button">我的</button>
      <button id="clear" type="button">清空</button>
    </section>

    <section class="filter-chips" id="filterChips" aria-label="当前筛选条件"></section>

    <section class="content">
      <aside class="panel tree-panel">
        <div class="head">
          <div>
            <div class="head-title">设备树</div>
            <div class="head-sub">按域和分组快速定位</div>
          </div>
        </div>
        <div class="tree" id="deviceTree"></div>
      </aside>

      <section class="panel">
        <div class="head">
          <div>
            <div class="head-title">设备列表</div>
            <div class="head-sub" id="listScope">全部设备</div>
          </div>
          <div class="stats" id="stats"></div>
        </div>
        <div class="table">
          <div class="thead">
            <div class="cell">板卡</div>
            <div class="cell">设备</div>
            <div class="cell">类型</div>
            <div class="cell">CPU</div>
            <div class="cell">Slot</div>
            <div class="cell">状态</div>
            <div class="cell">操作</div>
          </div>
          <div class="tbody" id="deviceRows"></div>
        </div>
      </section>

      <aside class="panel context-panel">
        <div class="head">
          <div>
            <div class="head-title">当前设备</div>
            <div class="head-sub">详情、连接和相关会话</div>
          </div>
        </div>
        <div class="body">
          <div id="devicePanel"></div>
          <div class="sessions" id="sessionList"></div>
        </div>
      </aside>
    </section>
  </main>

  <script>
    let bridge = null;
    let state = null;
    let applying = false;
    let filterTimer = null;
    let filtering = false;
    let activeTreeKey = "all";
    const FILTER_DEBOUNCE_MS = 140;
    const ENTER_ANIMATION_LIMIT = 80;
    const $ = (id) => document.getElementById(id);

    function debounceFilters() {
      if (applying || !bridge) return;
      setFiltering(true);
      window.clearTimeout(filterTimer);
      filterTimer = window.setTimeout(sendFilters, FILTER_DEBOUNCE_MS);
    }

    function sendFilters() {
      if (!bridge) return;
      bridge.updateFilters(JSON.stringify({
        search: $("search").value,
        domain: $("domain").value,
        status: $("status").value,
        cpu: $("cpu").value,
        mine: $("mine").classList.contains("active")
      }));
    }

    function setFiltering(active) {
      filtering = !!active;
      const rows = $("deviceRows");
      if (rows) {
        rows.classList.toggle("filtering", filtering);
        rows.setAttribute("aria-busy", filtering ? "true" : "false");
      }
    }

    function setInputValue(input, value) {
      const next = value || "";
      if (input.value === next) return;
      const focused = document.activeElement === input;
      const start = input.selectionStart;
      const end = input.selectionEnd;
      input.value = next;
      if (focused && start !== null && end !== null) {
        const position = Math.min(next.length, start);
        input.setSelectionRange(position, Math.min(next.length, end));
      }
    }

    function setOptions(select, values, current) {
      const nextValues = values || [];
      const signature = nextValues.join("\u0001");
      if (select.dataset.signature !== signature) {
        const fragment = document.createDocumentFragment();
        nextValues.forEach((value) => {
          const option = document.createElement("option");
          option.value = value;
          option.textContent = value;
          fragment.appendChild(option);
        });
        select.replaceChildren(fragment);
        select.dataset.signature = signature;
      }
      select.value = current || "";
      if (select.value !== (current || "") && nextValues.length) select.value = nextValues[0];
    }

    function createEmpty(text) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = text;
      return empty;
    }

    function replaceChildrenPreservingScroll(container, fragment) {
      const previousScrollTop = container.scrollTop;
      container.replaceChildren(fragment);
      container.scrollTop = Math.min(previousScrollTop, container.scrollHeight);
    }

    function visibleDeviceRows() {
      const rows = (state && state.rows ? state.rows : []).filter((item) => item.kind !== "group");
      if (activeTreeKey === "all") return rows;
      return rows.filter((item) => treeKeyForDevice(item) === activeTreeKey || domainKey(item.domain) === activeTreeKey);
    }

    function domainKey(domain) {
      return `domain:${domain || "未分组"}`;
    }

    function treeKeyForDevice(item) {
      const domain = item.domain || "未分组";
      const subdomain = item.subdomain || item.boardType || "默认分组";
      return `group:${domain}:${subdomain}`;
    }

    function buildTreeGroups(rows) {
      const domains = new Map();
      rows.filter((item) => item.kind !== "group").forEach((item) => {
        const domain = item.domain || "未分组";
        const subdomain = item.subdomain || item.boardType || "默认分组";
        if (!domains.has(domain)) domains.set(domain, new Map());
        const groups = domains.get(domain);
        if (!groups.has(subdomain)) groups.set(subdomain, []);
        groups.get(subdomain).push(item);
      });
      return domains;
    }

    function renderDeviceTree(rows) {
      const tree = $("deviceTree");
      const fragment = document.createDocumentFragment();
      const deviceRows = rows.filter((item) => item.kind !== "group");
      const root = document.createElement("button");
      root.className = `tree-node ${activeTreeKey === "all" ? "active" : ""}`.trim();
      root.type = "button";
      root.innerHTML = `<span class="tree-dot"></span><span class="tree-label">全部设备</span><span class="tree-count">${deviceRows.length}</span>`;
      root.addEventListener("click", () => setActiveTree("all"));
      fragment.appendChild(root);

      const domains = buildTreeGroups(rows);
      domains.forEach((groups, domain) => {
        const domainButton = document.createElement("button");
        const key = domainKey(domain);
        const count = Array.from(groups.values()).reduce((total, list) => total + list.length, 0);
        domainButton.className = `tree-node ${activeTreeKey === key ? "active" : ""}`.trim();
        domainButton.type = "button";
        domainButton.innerHTML = `<span class="tree-dot"></span><span class="tree-label">${escapeHtml(domain)}</span><span class="tree-count">${count}</span>`;
        domainButton.addEventListener("click", () => setActiveTree(key));
        fragment.appendChild(domainButton);
        groups.forEach((items, group) => {
          const groupButton = document.createElement("button");
          const groupKey = `group:${domain}:${group}`;
          groupButton.className = `tree-node ${activeTreeKey === groupKey ? "active" : ""}`.trim();
          groupButton.type = "button";
          groupButton.style.paddingLeft = "22px";
          groupButton.innerHTML = `<span></span><span class="tree-label">${escapeHtml(group)}</span><span class="tree-count">${items.length}</span>`;
          groupButton.addEventListener("click", () => setActiveTree(groupKey));
          fragment.appendChild(groupButton);
        });
      });
      tree.replaceChildren(fragment);
    }

    function setActiveTree(key) {
      activeTreeKey = key || "all";
      renderDeviceTree(state.rows || []);
      renderDeviceRows(visibleDeviceRows());
      updateListScope();
    }

    function updateListScope() {
      const rows = visibleDeviceRows();
      if (activeTreeKey === "all") {
        $("listScope").textContent = `全部设备 · ${rows.length}`;
        return;
      }
      const label = activeTreeKey.split(":").slice(1).join(" / ");
      $("listScope").textContent = `${label} · ${rows.length}`;
    }

    function requestInlineDeviceAction(item, action, event) {
      event.stopPropagation();
      if (!bridge) return;
      bridge.selectDevice(item.id);
      window.setTimeout(() => bridge.requestAction(action), 0);
    }

    function buildInlineActions(item) {
      const actions = document.createElement("div");
      actions.className = "row-actions";
      [
        ["telnet", "Telnet", !!item.telnet],
        ["ssh", "SSH", !!item.ssh],
        ["serial", "串口", !!item.canSerial]
      ].forEach(([action, label, enabled]) => {
        const button = document.createElement("button");
        button.className = action === "telnet" || action === "ssh" ? "inline-action primary" : "inline-action";
        button.type = "button";
        button.textContent = label;
        button.disabled = !enabled;
        button.addEventListener("click", (event) => requestInlineDeviceAction(item, action, event));
        actions.appendChild(button);
      });
      return actions;
    }

    function buildDeviceRow(item, index) {
      const row = document.createElement("div");
      row.className = item.kind === "group" ? "row group" : "row contextable";
      if (index < ENTER_ANIMATION_LIMIT) row.classList.add("entering");
      if (item.selected) row.classList.add("selected");
      if (item.kind === "group") {
        appendCell(row, item.name, item.name);
        appendCell(row, item.subdomain || "", item.subdomain || "", "muted");
        appendCell(row, `${item.count} 块板`, `${item.count} 块板`, "muted");
        appendCell(row, "", "");
        appendCell(row, "", "");
        appendCell(row, "", "");
        appendCell(row, "", "");
        return row;
      }
      row.addEventListener("click", () => bridge && bridge.selectDevice(item.id));
      row.addEventListener("contextmenu", (event) => requestDeviceRowContext(row, item, event));
      row.tabIndex = 0;
      wireDeviceRowKeyboard(row, item);
      appendCell(row, item.boardId, item.boardId);
      appendCell(row, item.deviceName || item.name, item.deviceName || item.name);
      appendCell(row, item.boardType, item.boardType);
      appendCell(row, item.cpu, item.cpu);
      appendCell(row, item.slot, item.slot);
      appendCell(row, item.statusText, item.statusTooltip || item.statusText, `status ${statusClass(item.statusText, item.statusKind)}`);
      row.appendChild(buildInlineActions(item));
      return row;
    }

    function buildSessionItem(session, index) {
      const item = document.createElement("div");
      item.className = `session ${session.active ? "active" : ""}`.trim();
      if (index < 20) item.classList.add("entering");
      item.tabIndex = 0;
      item.setAttribute("role", "button");
      item.setAttribute("aria-label", session.title || session.tabId || "");
      item.setAttribute("aria-current", session.active ? "true" : "false");
      const left = document.createElement("div");
      const title = document.createElement("div");
      title.className = "session-title";
      title.textContent = session.title;
      const sub = document.createElement("div");
      sub.className = "session-sub";
      sub.textContent = `${session.deviceName} / ${session.kind}${session.host ? ` / ${session.host}` : ""}`;
      left.appendChild(title);
      left.appendChild(sub);
      const status = document.createElement("div");
      status.className = `session-status ${sessionStatusClass(session.status)}`;
      status.textContent = session.statusLabel || session.status;
      item.appendChild(left);
      item.appendChild(status);
      item.addEventListener("click", () => bridge && bridge.selectSession(session.tabId));
      item.addEventListener("contextmenu", (event) => requestSessionContext(item, session, event));
      item.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          if (bridge) bridge.selectSession(session.tabId);
        } else if (event.key === "ContextMenu" || (event.shiftKey && event.key === "F10")) {
          requestSessionContext(item, session, event);
        }
      });
      return item;
    }

    function buildDevicePanel(device) {
      const frame = document.createElement("div");
      frame.className = "device-panel-frame entering";
      const name = document.createElement("div");
      name.className = "device-name";
      name.textContent = device.name;
      frame.appendChild(name);
      const meta = document.createElement("div");
      meta.className = "meta";
      appendMetaChip(meta, device.id);
      appendMetaChip(meta, device.domain);
      appendMetaChip(meta, device.statusText, `status ${statusClass(device.statusText, device.statusKind)}`);
      appendMetaChip(meta, device.owner);
      frame.appendChild(meta);
      const kv = document.createElement("div");
      kv.className = "kv";
      [
        ["板卡", device.boardType],
        ["CPU", device.cpu],
        ["Slot", device.slot],
        ["Telnet", device.telnet],
        ["SSH", device.ssh],
        ["串口", device.serial || "占用后可见"]
      ].forEach(([key, value]) => {
        const keyEl = document.createElement("div");
        keyEl.className = "key";
        keyEl.textContent = key;
        const valueEl = document.createElement("div");
        valueEl.className = "value";
        valueEl.textContent = value || "-";
        valueEl.title = value || "-";
        kv.appendChild(keyEl);
        kv.appendChild(valueEl);
      });
      frame.appendChild(kv);

      const actions = document.createElement("div");
      actions.className = "context-actions";
      [
        ["telnet", "连接 Telnet", !!device.telnet, true],
        ["ssh", "连接 SSH", !!device.ssh, true],
        ["serial", "连接串口", !!device.canSerial, false],
        ["occupancy", "占用 / 释放", true, false]
      ].forEach(([action, label, enabled, primary]) => {
        const button = document.createElement("button");
        button.className = primary ? "context-action primary" : "context-action";
        button.type = "button";
        button.textContent = label;
        button.disabled = !enabled;
        button.addEventListener("click", () => bridge && bridge.requestAction(action));
        actions.appendChild(button);
      });
      frame.appendChild(actions);
      return frame;
    }

    function statusClass(text, kind) {
      if (kind) return kind;
      const value = String(text || "");
      if (value.includes("空闲")) return "idle";
      if (value.includes("占用") && !value.includes("流水线")) return "occupied";
      if (value.includes("流水线")) return "pipeline";
      return "other";
    }

    function sessionStatusClass(status) {
      const normalized = String(status || "").toLowerCase();
      if (normalized === "connected") return "connected";
      if (normalized === "connecting") return "connecting";
      if (normalized === "disconnected") return "disconnected";
      return "";
    }

    function appendCell(row, text, title, extraClass) {
      const cell = document.createElement("div");
      cell.className = `cell ${extraClass || ""}`.trim();
      cell.textContent = text || "";
      cell.title = title || text || "";
      row.appendChild(cell);
    }

    function rowContextPoint(row) {
      const rect = row.getBoundingClientRect();
      return {
        x: Math.round(rect.left + Math.min(rect.width - 8, 32)),
        y: Math.round(rect.top + rect.height / 2)
      };
    }

    function requestDeviceRowContext(row, item, event) {
      if (!bridge) return;
      if (event) event.preventDefault();
      const point = event && Number.isFinite(event.clientX) && Number.isFinite(event.clientY)
        ? { x: event.clientX, y: event.clientY }
        : rowContextPoint(row);
      bridge.requestDeviceContextMenu(item.id, point.x, point.y);
    }

    function wireDeviceRowKeyboard(row, item) {
      row.setAttribute("role", "button");
      row.setAttribute("aria-label", item.name || item.id || "");
      row.setAttribute("aria-selected", item.selected ? "true" : "false");
      row.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          if (bridge) bridge.selectDevice(item.id);
        } else if (event.key === "ContextMenu" || (event.shiftKey && event.key === "F10")) {
          requestDeviceRowContext(row, item, event);
        }
      });
    }

    function appendMetaChip(container, text, extraClass) {
      if (!text) return;
      const chip = document.createElement("span");
      chip.className = `${extraClass || "chip"}`.trim();
      chip.textContent = text;
      chip.title = text;
      container.appendChild(chip);
    }

    function renderStats(stats, sessionCount) {
      $("stats").innerHTML = [
        `设备 <b>${stats.total || 0}</b>`,
        `空闲 <b class="idle">${stats.idle || 0}</b>`,
        `占用 <b class="occupied">${stats.occupied || 0}</b>`,
        `流水线 <b class="pipeline">${stats.pipeline || 0}</b>`,
        `会话 <b>${sessionCount || 0}</b>`
      ].join("");
    }

    function renderDeviceRows(rows) {
      const container = $("deviceRows");
      const fragment = document.createDocumentFragment();
      if (!rows || !rows.length) {
        fragment.appendChild(createEmpty("没有符合条件的设备。"));
        replaceChildrenPreservingScroll(container, fragment);
        return;
      }
      rows.forEach((item, index) => fragment.appendChild(buildDeviceRow(item, index)));
      replaceChildrenPreservingScroll(container, fragment);
    }

    function renderDevice(device) {
      const panel = $("devicePanel");
      const fragment = document.createDocumentFragment();
      if (!device) {
        fragment.appendChild(createEmpty("当前没有选中设备。"));
        panel.replaceChildren(fragment);
        return;
      }
      fragment.appendChild(buildDevicePanel(device));
      panel.replaceChildren(fragment);
    }

    function sessionContextPoint(item) {
      const rect = item.getBoundingClientRect();
      return {
        x: Math.round(rect.left + Math.min(rect.width - 8, 32)),
        y: Math.round(rect.top + rect.height / 2)
      };
    }

    function requestSessionContext(item, session, event) {
      if (!bridge) return;
      if (event) event.preventDefault();
      const point = event && Number.isFinite(event.clientX) && Number.isFinite(event.clientY)
        ? { x: event.clientX, y: event.clientY }
        : sessionContextPoint(item);
      bridge.requestSessionContextMenu(session.tabId, point.x, point.y);
    }

    function renderSessions(sessions) {
      const list = $("sessionList");
      const fragment = document.createDocumentFragment();
      const selectedId = state && state.selectedDevice ? state.selectedDevice.id : "";
      const related = selectedId ? sessions.filter((session) => session.deviceId === selectedId) : sessions;
      const title = document.createElement("div");
      title.className = "head-title";
      title.textContent = selectedId ? "相关会话" : "已打开会话";
      fragment.appendChild(title);
      if (!related.length) {
        fragment.appendChild(createEmpty(selectedId ? "当前设备没有打开的终端会话。" : "当前没有打开终端会话。"));
        list.replaceChildren(fragment);
        return;
      }
      related.forEach((session, index) => fragment.appendChild(buildSessionItem(session, index)));
      list.replaceChildren(fragment);
    }

    function renderFilterChips() {
      const container = $("filterChips");
      const fragment = document.createDocumentFragment();
      const filters = state.filters || {};
      const defaults = {
        domain: (state.domains || [])[0] || "",
        status: (state.statuses || [])[0] || ""
      };
      [
        ["search", "搜索", filters.search, () => setInputValue($("search"), "")],
        ["domain", "域", filters.domain && filters.domain !== defaults.domain ? filters.domain : "", () => $("domain").value = defaults.domain],
        ["status", "状态", filters.status && filters.status !== defaults.status ? filters.status : "", () => $("status").value = defaults.status],
        ["cpu", "CPU", filters.cpu, () => setInputValue($("cpu"), "")],
        ["mine", "我的", filters.mine ? "仅我的占用" : "", () => $("mine").classList.remove("active")]
      ].forEach(([_key, label, value, clear]) => {
        if (!value) return;
        const chip = document.createElement("button");
        chip.className = "filter-chip";
        chip.type = "button";
        chip.innerHTML = `<span>${label}</span><b>${escapeHtml(String(value))}</b><span>×</span>`;
        chip.addEventListener("click", () => {
          clear();
          sendFilters();
        });
        fragment.appendChild(chip);
      });
      if (!fragment.childNodes.length) {
        const hint = document.createElement("span");
        hint.className = "empty";
        hint.textContent = "未启用筛选。可以用搜索、域、状态或“我的”快速收窄设备池。";
        fragment.appendChild(hint);
      }
      container.replaceChildren(fragment);
    }

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    window.setWebShellPayload = function setWebShellPayload(payload) {
      state = payload || {};
      applying = true;
      window.clearTimeout(filterTimer);
      setFiltering(false);
      setOptions($("domain"), state.domains || [], state.filters && state.filters.domain || "");
      setOptions($("status"), state.statuses || [], state.filters && state.filters.status || "");
      setInputValue($("search"), state.filters && state.filters.search || "");
      setInputValue($("cpu"), state.filters && state.filters.cpu || "");
      $("mine").classList.toggle("active", !!(state.filters && state.filters.mine));
      $("mine").textContent = `我的 ${state.stats && state.stats.mine || 0}`;
      $("clear").disabled = !state.hasFilters;
      $("summary").textContent = state.summary || "当前显示全部设备";
      const sessionCount = state.sessions ? state.sessions.length : 0;
      $("sessionsWorkspace").disabled = sessionCount === 0;
      $("sessionsWorkspace").textContent = `终端会话 (${sessionCount})`;
      const activeExists = activeTreeKey === "all" || (state.rows || []).some((item) => {
        if (item.kind === "group") return false;
        return treeKeyForDevice(item) === activeTreeKey || domainKey(item.domain) === activeTreeKey;
      });
      if (!activeExists) activeTreeKey = "all";
      renderStats(state.stats || {}, state.sessions ? state.sessions.length : 0);
      renderFilterChips();
      renderDeviceTree(state.rows || []);
      renderDeviceRows(visibleDeviceRows());
      updateListScope();
      renderDevice(state.selectedDevice || null);
      renderSessions(state.sessions || []);
      applying = false;
    };

    function wire() {
      $("refresh").addEventListener("click", () => bridge && bridge.requestRefresh());
      $("sessionsWorkspace").addEventListener("click", () => bridge && bridge.requestAction("sessions"));
      $("clear").addEventListener("click", () => bridge && bridge.clearFilters());
      ["search", "cpu"].forEach((id) => $(id).addEventListener("input", debounceFilters));
      ["domain", "status"].forEach((id) => $(id).addEventListener("change", debounceFilters));
      $("mine").addEventListener("click", () => {
        $("mine").classList.toggle("active");
        sendFilters();
      });
    }

    new QWebChannel(qt.webChannelTransport, (channel) => {
      bridge = channel.objects.webShellBridge;
      wire();
    });
  </script>
</body>
</html>
