<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>连接凭据</title>
    <script>
      document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') === 'light'
        ? 'light'
        : 'dark'
    </script>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, "Segoe UI", "Microsoft YaHei UI", sans-serif;
        --bg: #020617; --surface: #08101d; --raised: #0f172a; --hover: #111c2f;
        --line: #243244; --strong: #334155; --text: #f8fafc; --muted: #a7b4c7; --soft: #718096;
        --accent: #22c55e; --accent-hover: #16a34a; --blue: #60a5fa; --danger: #f87171;
        --focus: rgba(96, 165, 250, .28); --hint-line: rgba(96, 165, 250, .22);
        --hint-bg: rgba(96, 165, 250, .06);
      }
      :root[data-theme="light"] {
        color-scheme: light;
        --bg: #f2f4f6; --surface: #ffffff; --raised: #f8fafc; --hover: #eef2f7;
        --line: #d7dde6; --strong: #c7d0dc; --text: #111827; --muted: #475569; --soft: #64748b;
        --accent: #16a34a; --accent-hover: #15803d; --blue: #2563eb; --danger: #dc2626;
        --focus: rgba(37, 99, 235, .22); --hint-line: rgba(37, 99, 235, .24);
        --hint-bg: rgba(37, 99, 235, .06);
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { padding: 22px; color: var(--text); background: var(--surface); font-size: 13px; }
      main { height: 100%; display: grid; grid-template-rows: auto 1fr auto; gap: 18px; }
      .eyebrow { margin: 0 0 5px; color: var(--soft); font-size: 10px; font-weight: 750; letter-spacing: .13em; }
      h1 { margin: 0; font-size: 18px; }
      .copy { margin: 8px 0 0; color: var(--muted); line-height: 1.55; }
      .endpoint { color: var(--blue); font: 12px Consolas, monospace; }
      form { display: grid; align-content: start; gap: 13px; }
      label { display: grid; gap: 7px; color: var(--muted); font-size: 11px; font-weight: 650; }
      input[type="text"], input[type="number"], input[type="password"] {
        height: 38px; padding: 0 11px; color: var(--text); border: 1px solid var(--strong);
        border-radius: 8px; outline: 0; background: var(--bg); font: 14px Consolas, monospace;
      }
      input[type="text"]:focus, input[type="number"]:focus, input[type="password"]:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--focus); }
      .password-field { display: grid; grid-template-columns: minmax(0, 1fr) 58px; gap: 7px; }
      .password-field button { height: 38px; padding: 0 9px; }
      .target-grid { display: grid; grid-template-columns: minmax(0, 1fr) 110px; gap: 12px; }
      .target-grid label:first-child { min-width: 0; }
      .save-row { display: flex; grid-template-columns: auto 1fr; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; font-weight: 400; }
      .save-row input { accent-color: var(--accent); }
      .hint { margin: 0; padding: 9px 10px; color: var(--muted); line-height: 1.5; border: 1px solid var(--hint-line); border-radius: 8px; background: var(--hint-bg); }
      footer { display: flex; justify-content: flex-end; gap: 8px; }
      button { min-height: 34px; padding: 0 13px; color: var(--muted); font: inherit; font-size: 12px; font-weight: 650; border: 1px solid var(--line); border-radius: 8px; background: var(--raised); cursor: pointer; }
      button:hover { color: var(--text); border-color: var(--blue); background: var(--hover); }
      button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
      .primary { color: #fff; border-color: var(--accent); background: #15803d; }
      .primary:hover { color: #fff; border-color: var(--accent-hover); background: var(--accent-hover); }
      .danger { margin-right: auto; color: #fecaca; border-color: rgba(248, 113, 113, .42); }
      .danger:hover { border-color: var(--danger); background: rgba(248, 113, 113, .1); }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">SECURE CREDENTIAL PROMPT</p>
        <h1 id="title">连接凭据</h1>
        <p class="copy"><span id="protocol"></span> <span id="endpoint" class="endpoint"></span></p>
      </header>
      <form id="credential-form">
        <div id="target-fields" class="target-grid" hidden>
          <label>
            IP / 主机
            <input id="host" type="text" maxlength="255" autocomplete="off" />
          </label>
          <label>
            端口
            <input id="port" type="number" min="1" max="65535" />
          </label>
        </div>
        <label id="username-row" hidden>
          账号
          <input id="username" type="text" maxlength="255" autocomplete="username" />
        </label>
        <label>
          <span id="password-label">密码</span>
          <span class="password-field">
            <input id="password" type="password" maxlength="4096" autocomplete="current-password" autofocus />
            <button id="password-toggle" type="button" aria-label="显示密码" aria-pressed="false">显示</button>
          </span>
        </label>
        <label id="cid-row" hidden>
          CID
          <input id="cid" type="text" maxlength="255" autocomplete="off" spellcheck="false" />
        </label>
        <label id="save-row" class="save-row">
          <input id="save" type="checkbox" />
          <span id="save-label">保存到操作系统凭据库</span>
        </label>
        <label id="auto-login-row" class="save-row" hidden>
          <input id="auto-login" type="checkbox" />
          <span>启动 App 时自动登录</span>
        </label>
        <p id="hint" class="hint">不保存时，密码只用于本次会话；不会进入 Vue 状态、SQLite 或日志。</p>
      </form>
      <footer>
        <button id="remove" class="danger" type="button" hidden>删除已保存凭据</button>
        <button id="cancel" type="button">取消</button>
        <button id="submit" class="primary" type="submit" form="credential-form">连接</button>
      </footer>
    </main>
    <script>
      const params = new URLSearchParams(location.search)
      const requestedMode = params.get('mode')
      const mode = requestedMode === 'manage'
        ? 'manage'
        : requestedMode === 'custom'
          ? 'custom'
          : requestedMode === 'internal'
            ? 'internal'
            : 'connect'
      const profile = params.get('profile') || '连接配置'
      const protocol = (params.get('protocol') || '').toUpperCase()
      const endpoint = params.get('endpoint') || ''
      const hasPassword = params.get('hasPassword') === '1'
      const form = document.getElementById('credential-form')
      const targetFields = document.getElementById('target-fields')
      const host = document.getElementById('host')
      const port = document.getElementById('port')
      const usernameRow = document.getElementById('username-row')
      const username = document.getElementById('username')
      const cidRow = document.getElementById('cid-row')
      const cid = document.getElementById('cid')
      const password = document.getElementById('password')
      const passwordToggle = document.getElementById('password-toggle')
      const save = document.getElementById('save')
      const saveRow = document.getElementById('save-row')
      const saveLabel = document.getElementById('save-label')
      const autoLoginRow = document.getElementById('auto-login-row')
      const autoLogin = document.getElementById('auto-login')
      const hint = document.getElementById('hint')
      const remove = document.getElementById('remove')
      const submit = document.getElementById('submit')
      const removeInitListener = window.credentialDialogApi.onInit(({ password: savedPassword }) => {
        if (savedPassword) {
          password.value = savedPassword
          password.placeholder = mode === 'custom'
            ? '已填入设备已有密码'
            : '已填入系统凭据库中的密码'
        }
      })
      document.getElementById('title').textContent = mode === 'manage' ? `管理 ${profile} 凭据` : `连接 ${profile}`
      document.getElementById('protocol').textContent = protocol
      document.getElementById('endpoint').textContent = endpoint
      if (mode === 'manage') {
        save.checked = true
        saveRow.hidden = true
        hint.textContent = '新密码将只写入操作系统凭据库，不会进入 Vue 状态、SQLite 或日志。'
        remove.hidden = !hasPassword
        submit.textContent = '保存凭据'
      } else if (mode === 'custom') {
        targetFields.hidden = false
        usernameRow.hidden = false
        host.value = params.get('host') || ''
        port.value = params.get('port') || ''
        username.value = params.get('username') || ''
        password.required = false
        password.autofocus = false
        host.autofocus = true
        saveRow.hidden = true
        document.getElementById('password-label').textContent = '密码（留空则使用设备已有凭据）'
        hint.textContent = 'IP、端口和账号仅用于本次连接；密码通过隔离窗口交给 Python，不会进入 Vue、SQLite 或日志。'
        queueMicrotask(() => host.focus())
      } else if (mode === 'internal') {
        usernameRow.hidden = false
        cidRow.hidden = false
        username.value = params.get('username') || ''
        cid.value = params.get('cid') || ''
        saveRow.hidden = false
        saveLabel.textContent = '记住登录（密码保存到操作系统凭据库）'
        save.checked = hasPassword
        autoLoginRow.hidden = false
        autoLogin.checked = params.get('autoLogin') === '1' && hasPassword
        password.autofocus = false
        password.placeholder = hasPassword ? '留空使用已安全保存的密码' : '输入登录密码'
        document.getElementById('title').textContent = `登录 ${profile}`
        document.getElementById('protocol').textContent = '使用 Cookie 会话加载设备'
        submit.textContent = '登录并加载设备'
        hint.textContent = '账号和 CID 会保存；勾选记住登录后，密码仅保存到操作系统凭据库。登录 Cookie 只保留在本次 App 运行期间。'
        queueMicrotask(() => (username.value ? (hasPassword ? cid : password) : username).focus())
      }
      passwordToggle.addEventListener('click', () => {
        const visible = password.type === 'text'
        password.type = visible ? 'password' : 'text'
        passwordToggle.textContent = visible ? '显示' : '隐藏'
        passwordToggle.setAttribute('aria-label', visible ? '显示密码' : '隐藏密码')
        passwordToggle.setAttribute('aria-pressed', visible ? 'false' : 'true')
        password.focus()
      })
      autoLogin.addEventListener('change', () => {
        if (autoLogin.checked) save.checked = true
      })
      save.addEventListener('change', () => {
        if (!save.checked) autoLogin.checked = false
      })
      form.addEventListener('submit', (event) => {
        event.preventDefault()
        const value = password.value
        password.value = ''
        window.credentialDialogApi.submit({
          password: value,
          save: mode === 'manage' || save.checked,
          ...(mode === 'custom' ? {
            host: host.value,
            port: Number(port.value),
            username: username.value
          } : {}),
          ...(mode === 'internal' ? {
            username: username.value,
            cid: cid.value,
            autoLogin: autoLogin.checked
          } : {})
        })
      })
      remove.addEventListener('click', () => window.credentialDialogApi.remove())
      document.getElementById('cancel').addEventListener('click', () => window.credentialDialogApi.cancel())
      window.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') window.credentialDialogApi.cancel()
      })
      window.addEventListener('beforeunload', removeInitListener, { once: true })
    </script>
  </body>
</html>
