<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workflow 步骤配置示例</title>
<style>
:root{color-scheme:dark;--bg:#18191c;--panel:#202125;--line:#36383e;--muted:#a2a5af;--text:#eceef2;--accent:#68d6b1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px 'Segoe UI','Microsoft YaHei',sans-serif;letter-spacing:0}button,input,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button{border:1px solid var(--line);background:#292b30;border-radius:5px;padding:8px 12px}header{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}header strong{font-size:16px}small,.muted{color:var(--muted)}.save{color:#122b22;background:var(--accent);border-color:var(--accent)}.workspace{display:grid;grid-template-columns:220px minmax(300px,1fr) 400px;min-height:calc(100vh - 64px)}nav{padding:24px 16px;border-right:1px solid var(--line)}nav h3{font-size:12px;color:var(--muted);margin:0 8px 18px}nav button{display:block;width:100%;text-align:left;margin:4px 0;background:transparent;border-color:transparent}nav button.active{background:#303339;border-color:#4a4e58}nav small{display:block;margin-top:5px}.canvas{position:relative;background-image:radial-gradient(#373940 1px,transparent 1px);background-size:22px 22px;display:flex;align-items:center;flex-direction:column;padding:60px 24px;min-height:650px}.node{width:260px;border:1px solid #494c55;background:var(--panel);border-radius:7px;padding:17px 18px}.node.selected{border:2px solid var(--accent);padding:16px 17px;box-shadow:0 0 0 4px #68d6b112}.node strong{display:block;margin-bottom:9px;font-size:15px}.node small{display:block;line-height:1.7}.wire{height:52px;width:2px;background:#69747b}.status{position:absolute;bottom:22px;left:24px;color:var(--accent);font-size:12px}aside{background:var(--panel);border-left:1px solid var(--line)}.heading{padding:24px;border-bottom:1px solid var(--line)}.heading h1{font-size:20px;margin:8px 0}.heading small{font-size:12px}.tabs{display:flex;gap:24px;padding:0 24px;border-bottom:1px solid var(--line)}.tabs button{border:0;border-radius:0;background:none;padding:15px 0;color:var(--muted)}.tabs button.active{color:var(--text);box-shadow:inset 0 -2px var(--accent)}.content{padding:24px}.field{margin-bottom:24px}.label{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.label label{font-weight:600}.required{font-size:11px;color:#e8ba71}input,select{width:100%;background:#18191c;border:1px solid #494c55;border-radius:5px;height:38px;padding:0 11px}.segments{display:flex;gap:3px;background:#17181b;padding:3px;border-radius:5px}.segments button{padding:4px 9px;border:0;background:none;color:var(--muted);font-size:12px}.segments button.active{background:#3a3d44;color:white}.reference{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;background:#191b1e;padding:10px 12px}.reference strong{font-weight:500;display:block}.reference small{display:block;margin-top:5px;font-size:12px}.picker{margin-top:8px;border:1px solid #555b66;border-radius:6px;padding:10px;background:#292b30;box-shadow:0 12px 24px #0003}.picker input{height:34px}.group-title{font-size:11px;color:var(--muted);padding:13px 7px 6px}.option{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:0;background:none;margin:3px 0;padding:9px 7px}.option:hover{background:#3a3d44}.option small{font-size:10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.unit{position:relative}.unit input{padding-right:35px}.unit span{position:absolute;right:12px;top:10px;color:var(--muted)}.help{margin:8px 0 0;color:var(--muted);font-size:12px;line-height:1.6}details{border-top:1px solid var(--line);padding:18px 0}summary{cursor:pointer;font-weight:500}details .row{margin-top:18px}.footer{border-top:1px solid var(--line);padding:20px 24px;display:flex;justify-content:space-between;align-items:center}.test{border-color:#6d9588;color:var(--accent)}.output{line-height:2}.output code{color:var(--accent)}[hidden]{display:none!important}@media(min-width:1600px){.workspace{grid-template-columns:240px minmax(300px,1fr) 440px}}@media(max-width:1000px){.workspace{grid-template-columns:minmax(280px,1fr) 400px}nav{display:none}}@media(max-width:700px){header{padding:0 16px}.workspace{display:block}.canvas{min-height:390px;padding:25px}.wire{height:24px}.node{padding:10px 16px}.node.selected{padding:9px 15px}aside{border-left:0;border-top:1px solid var(--line)}.status{display:none}.heading,.content{padding:20px}}
</style>
<header><div><strong>设备检查流程</strong> <small> / 草稿</small></div><button class="save" id="save">保存流程</button></header>
<main class="workspace">
<nav><h3>流程步骤 · 4</h3><button>01　流程输入<small>目标设备</small></button><button>02　选择设备<small>使用流程输入</small></button><button class="active">03　等待终端输出<small>包含文本 · 30 秒</small></button><button>04　流程结果<small>输出匹配结果</small></button></nav>
<section class="canvas" aria-label="流程画布"><div class="node"><strong>流程输入</strong><small>目标设备 · device</small></div><div class="wire"></div><div class="node"><strong>选择设备</strong><small>来源：流程输入 / 目标设备</small></div><div class="wire"></div><div class="node selected"><strong>等待终端输出</strong><small id="summary">包含文本 · 引用匹配内容<br>超时 30 秒</small></div><div class="wire"></div><div class="node"><strong>流程结果</strong><small>匹配状态、终端输出</small></div><div class="status">● 流程结构检查通过</div></section>
<aside><div class="heading"><small>步骤 03 / 终端操作</small><h1>等待终端输出</h1><small>等待终端返回指定内容后继续执行</small></div>
<div class="tabs"><button class="active" data-tab="config">参数配置</button><button data-tab="output">输出字段</button></div>
<div class="content" id="config"><div class="field"><div class="label"><label for="name">步骤名称</label></div><input id="name" value="等待终端输出"></div>
<div class="field"><div class="label"><label>匹配内容 <span class="required">必填</span></label><div class="segments"><button data-mode="literal">固定值</button><button class="active" data-mode="reference">引用</button></div></div>
<input id="literal" placeholder="输入要等待的终端内容" hidden>
<button class="reference" id="choose" aria-expanded="true"><span><strong id="chosen">流程输入 / 匹配文本</strong><small id="token">${inputs.pattern}</small></span><span>⌄</span></button>
<div class="picker" id="picker"><input id="search" type="search" aria-label="搜索变量引用" placeholder="搜索名称或字段"><div class="group-title">流程输入</div><button class="option" data-value="inputs.pattern" data-label="流程输入 / 匹配文本"><span>匹配文本</span><small>STRING</small></button><div class="group-title">选择设备 · 步骤 02</div><button class="option" data-value="select.device_id" data-label="选择设备 / 设备 ID"><span>设备 ID</span><small>STRING</small></button><button class="option" data-value="select.status" data-label="选择设备 / 状态"><span>状态</span><small>STRING</small></button></div></div>
<div class="row"><div class="field"><div class="label"><label for="match">匹配方式</label></div><select id="match"><option>包含文本</option><option>正则表达式</option></select></div><div class="field"><div class="label"><label for="timeout">超时时间</label></div><div class="unit"><input id="timeout" type="number" min="1" value="30"><span>秒</span></div></div></div>
<label style="display:flex;align-items:center;gap:9px;margin-bottom:24px"><input type="checkbox" style="width:16px;height:16px">区分大小写</label>
<details><summary>执行策略</summary><div class="row"><div><div class="label"><label for="retry">失败重试</label></div><input id="retry" type="number" min="0" value="0"></div><div><div class="label"><label for="failure">失败后</label></div><select id="failure"><option>停止流程</option><option>继续执行</option></select></div></div></details>
</div><div class="content output" id="output" hidden><strong>可用输出</strong><p>匹配状态 <code>matched</code><br>终端输出 <code>output</code><br>匹配内容 <code>match</code></p></div>
<div class="footer"><small id="feedback">● 必填参数已设置</small><button class="test" id="test">▷ 测试步骤</button></div></aside></main>
<script>
const picker=document.querySelector('#picker'),choose=document.querySelector('#choose');choose.onclick=()=>{picker.hidden=!picker.hidden;choose.setAttribute('aria-expanded',String(!picker.hidden));if(!picker.hidden)document.querySelector('#search').focus()};
document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{document.querySelector('#chosen').textContent=b.dataset.label;document.querySelector('#token').textContent='${'+b.dataset.value+'}';picker.hidden=true;choose.setAttribute('aria-expanded','false');choose.focus()});
document.querySelector('#search').oninput=e=>document.querySelectorAll('.option').forEach(b=>b.hidden=!b.textContent.toLowerCase().includes(e.target.value.toLowerCase()));
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));const fixed=b.dataset.mode==='literal';document.querySelector('#literal').hidden=!fixed;choose.hidden=fixed;picker.hidden=true});
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>{x.classList.toggle('active',x===b);document.getElementById(x.dataset.tab).hidden=x!==b})});
document.querySelector('#save').onclick=e=>{e.target.textContent='已保存';};document.querySelector('#test').onclick=()=>{document.querySelector('#feedback').textContent='示例未连接设备';};document.addEventListener('keydown',e=>{if(e.key==='Escape'){picker.hidden=true;choose.setAttribute('aria-expanded','false')}});
</script>
</html>
