<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <link rel="stylesheet" href="assets/workspace-theme.css" />
  <title>Device Workspace</title>
  <style>
    .shell {
      height: 100vh;
      min-height: 0;
      display: grid;
      grid-template-rows: auto auto 1fr;
      background:
        radial-gradient(circle at 10% 0, var(--home-glow-accent), transparent 32%),
        radial-gradient(circle at 95% 5%, var(--home-glow-blue), transparent 34%),
        var(--bg);
    }

    .top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: var(--surface-top);
    }

    .eyebrow {
      color: var(--accent);
      font: 800 10px/1.2 "Cascadia Mono", Consolas, monospace;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .title { margin-top: 3px; font-size: 19px; font-weight: 800; letter-spacing: -0.02em; }
    .subtitle { margin-top: 4px; color: var(--muted); line-height: 1.35; }
    .top-actions { display: flex; align-items: center; gap: 8px; }

    .filterbar {
      display: grid;
      grid-template-columns: minmax(220px, 1.4fr) minmax(130px, 0.8fr) minmax(130px, 0.8fr) 92px auto auto;
      gap: 8px;
      align-items: center;
      padding: 10px 16px;
      border-bottom: 1px solid var(--line);
      background: var(--surface-filter);
    }

    .content {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(520px, 1fr) 340px;
      gap: 10px;
      padding: 10px;
      overflow: hidden;
    }

    .panel,
    .card {
      min-height: 0;
      border: 1px solid var(--line);
      background: var(--surface-card);
      border-radius: 12px;
      overflow: hidden;
    }

    .panel {
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .side {
      min-height: 0;
      display: grid;
      align-content: start;
      gap: 10px;
      overflow: auto;
    }

    .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-2);
    }

    .head-title { font-weight: 800; color: var(--text); }
    .head-sub { margin-top: 2px; color: var(--muted); font-size: 12px; }
    .body { padding: 12px; }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      color: var(--muted);
      line-height: 1.35;
      justify-content: flex-end;
    }

    .stats b { color: var(--text); font-weight: 800; }
    .idle { color: var(--accent); }
    .occupied { color: var(--warn); }
    .pipeline { color: var(--blue); }
    .other { color: var(--soft); }

    .table {
      min-height: 0;
      display: grid;
      grid-template-rows: 30px 1fr;
      background: var(--bg);
    }

    .thead,
    .row {
      display: grid;
      grid-template-columns: 66px minmax(180px, 1.45fr) minmax(120px, 1fr) 76px 86px 128px;
      align-items: center;
    }

    .thead {
      padding-right: 10px;
      font-size: 12px;
      font-weight: 700;
    }

    .tbody { min-height: 0; overflow: auto; }
    .cell { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 9px; }

    .row {
      min-height: 32px;
      cursor: pointer;
    }

    .row.group { min-height: 28px; }
    .row.group .muted { color: var(--soft); font-weight: 400; }
    .device-name { font-size: 17px; font-weight: 800; line-height: 1.3; }
    .meta { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      max-width: 190px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 12px;
    }

    .kv { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 7px; line-height: 1.75; margin-top: 12px; }
    .key { color: var(--soft); }
    .value { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .sessions { display: grid; gap: 8px; }
    .session { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; border: 1px solid var(--line); background: var(--input); border-radius: 9px; padding: 8px 9px; cursor: pointer; }
    .session:hover,
    .session.active { border-color: var(--success-line); background: var(--success-soft); }
    .session-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
    .session-sub { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .session-status { font-weight: 800; color: var(--muted); }
    .session-status.connected { color: var(--accent); }
    .session-status.connecting { color: var(--blue); }
    .session-status.disconnected { color: var(--danger); }
    .empty { line-height: 1.6; padding: 14px 10px; }

    @media (max-width: 1100px) {
      .content { grid-template-columns: 1fr; overflow: auto; }
      .panel { min-height: 460px; }
      .side { overflow: visible; }
    }

    @media (max-width: 760px) {
      .filterbar { grid-template-columns: 1fr 1fr; }
      .thead,
      .row { grid-template-columns: 54px minmax(140px, 1.4fr) 96px 64px 72px 100px; }
    }
  </style>
</head>
<body class="workspace-page">
  <main class="shell">
    <header class="top">
      <div>
        <div class="eyebrow">Web Rendered Home</div>
        <div class="title">设备池首页大屏</div>
        <div class="subtitle" id="summary">当前显示全部设备</div>
      </div>
      <div class="top-actions">
        <button class="primary" id="sessionsWorkspace" type="button">终端会话 (0)</button>
        <button id="refresh" type="button">刷新</button>
      </div>
    </header>
    <section class="filterbar">
      <input id="search" autocomplete="off" placeholder="搜索名称、ID、板卡、型号" />
      <select id="domain"></select>
      <select id="status"></select>
      <input id="cpu" autocomplete="off" placeholder="CPU" />
      <button id="mine" type="button">我的</button>
      <button id="clear" type="button">清空</button>
    </section>
    <section class="content">
      <section class="panel">
        <div class="head">
          <div>
            <div class="head-title">设备列表</div>
            <div class="head-sub">首页即设备池；打开终端后左侧设备池作为会话导航显示</div>
          </div>
          <div class="stats" id="stats"></div>
        </div>
        <div class="table">
          <div class="thead">
            <div class="cell">序号</div>
            <div class="cell">设备</div>
            <div class="cell">板类型</div>
            <div class="cell">CPU</div>
            <div class="cell">Slot</div>
            <div class="cell">状态</div>
          </div>
          <div class="tbody" id="deviceRows"></div>
        </div>
      </section>
      <aside class="side">
        <section class="card">
          <div class="head"><div class="head-title">当前设备</div></div>
          <div class="body" id="devicePanel"></div>
        </section>
        <section class="card">
          <div class="head"><div class="head-title">连接动作</div></div>
          <div class="body"><div class="actions">
            <button class="primary" data-action="telnet" type="button">连接 Telnet</button>
            <button class="primary" data-action="ssh" type="button">连接 SSH</button>
            <button data-action="serial" type="button">连接串口</button>
            <button data-action="occupancy" type="button">占用 / 释放</button>
          </div></div>
        </section>
        <section class="card">
          <div class="head"><div class="head-title">已打开会话</div></div>
          <div class="body"><div class="sessions" id="sessionList"></div></div>
        </section>
      </aside>
    </section>
  </main>

  <script>
    let bridge = null;
    let state = null;
    let applying = false;
    let filterTimer = null;
    const $ = (id) => document.getElementById(id);

    function debounceFilters() {
      if (applying || !bridge) return;
      window.clearTimeout(filterTimer);
      filterTimer = window.setTimeout(sendFilters, 80);
    }

    function sendFilters() {
      if (!bridge) return;
      bridge.updateFilters(JSON.stringify({
        search: $("search").value,
        domain: $("domain").value,
        status: $("status").value,
        cpu: $("cpu").value,
        mine: $("mine").classList.contains("active")
      }));
    }

    function setOptions(select, values, current) {
      select.innerHTML = "";
      (values || []).forEach((value) => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        select.appendChild(option);
      });
      select.value = current || "";
      if (select.value !== (current || "") && values && values.length) select.value = values[0];
    }

    function statusClass(text, kind) {
      if (kind) return kind;
      const value = String(text || "");
      if (value.includes("空闲")) return "idle";
      if (value.includes("占用") && !value.includes("流水线")) return "occupied";
      if (value.includes("流水线")) return "pipeline";
      return "other";
    }

    function sessionStatusClass(status) {
      const normalized = String(status || "").toLowerCase();
      if (normalized === "connected") return "connected";
      if (normalized === "connecting") return "connecting";
      if (normalized === "disconnected") return "disconnected";
      return "";
    }

    function appendCell(row, text, title, extraClass) {
      const cell = document.createElement("div");
      cell.className = `cell ${extraClass || ""}`.trim();
      cell.textContent = text || "";
      cell.title = title || text || "";
      row.appendChild(cell);
    }

    function rowContextPoint(row) {
      const rect = row.getBoundingClientRect();
      return {
        x: Math.round(rect.left + Math.min(rect.width - 8, 32)),
        y: Math.round(rect.top + rect.height / 2)
      };
    }

    function requestDeviceRowContext(row, item, event) {
      if (!bridge) return;
      if (event) event.preventDefault();
      const point = event && Number.isFinite(event.clientX) && Number.isFinite(event.clientY)
        ? { x: event.clientX, y: event.clientY }
        : rowContextPoint(row);
      bridge.requestDeviceContextMenu(item.id, point.x, point.y);
    }

    function wireDeviceRowKeyboard(row, item) {
      row.setAttribute("role", "button");
      row.setAttribute("aria-label", item.name || item.id || "");
      row.setAttribute("aria-selected", item.selected ? "true" : "false");
      row.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          if (bridge) bridge.selectDevice(item.id);
        } else if (event.key === "ContextMenu" || (event.shiftKey && event.key === "F10")) {
          requestDeviceRowContext(row, item, event);
        }
      });
    }

    function appendMetaChip(container, text, extraClass) {
      if (!text) return;
      const chip = document.createElement("span");
      chip.className = `${extraClass || "chip"}`.trim();
      chip.textContent = text;
      chip.title = text;
      container.appendChild(chip);
    }

    function renderStats(stats, sessionCount) {
      $("stats").innerHTML = [
        `设备 <b>${stats.total || 0}</b>`,
        `空闲 <b class="idle">${stats.idle || 0}</b>`,
        `占用 <b class="occupied">${stats.occupied || 0}</b>`,
        `流水线 <b class="pipeline">${stats.pipeline || 0}</b>`,
        `会话 <b>${sessionCount || 0}</b>`
      ].join("");
    }

    function renderDeviceRows(rows) {
      const container = $("deviceRows");
      container.innerHTML = "";
      if (!rows || !rows.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "没有符合条件的设备。";
        container.appendChild(empty);
        return;
      }
      rows.forEach((item) => {
        const row = document.createElement("div");
        row.className = item.kind === "group" ? "row group" : "row contextable";
        if (item.selected) row.classList.add("selected");
        if (item.kind === "group") {
          appendCell(row, item.name, item.name);
          appendCell(row, item.subdomain || "", item.subdomain || "", "muted");
          appendCell(row, `${item.count} 块板`, `${item.count} 块板`, "muted");
          appendCell(row, "", "");
          appendCell(row, "", "");
          appendCell(row, "", "");
          container.appendChild(row);
          return;
        }
        row.addEventListener("click", () => bridge && bridge.selectDevice(item.id));
        row.addEventListener("contextmenu", (event) => requestDeviceRowContext(row, item, event));
        row.tabIndex = 0;
        wireDeviceRowKeyboard(row, item);
        appendCell(row, item.boardId, item.boardId);
        appendCell(row, item.name, item.name);
        appendCell(row, item.boardType, item.boardType);
        appendCell(row, item.cpu, item.cpu);
        appendCell(row, item.slot, item.slot);
        appendCell(row, item.statusText, item.statusTooltip || item.statusText, `status ${statusClass(item.statusText, item.statusKind)}`);
        container.appendChild(row);
      });
    }

    function renderDevice(device) {
      const panel = $("devicePanel");
      panel.innerHTML = "";
      if (!device) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "当前没有选中设备。";
        panel.appendChild(empty);
        document.querySelectorAll("[data-action]").forEach((button) => button.disabled = true);
        return;
      }
      document.querySelectorAll("[data-action]").forEach((button) => {
        const action = button.getAttribute("data-action");
        button.disabled = action === "serial" && !device.canSerial;
      });
      const name = document.createElement("div");
      name.className = "device-name";
      name.textContent = device.name;
      panel.appendChild(name);
      const meta = document.createElement("div");
      meta.className = "meta";
      appendMetaChip(meta, device.id);
      appendMetaChip(meta, device.domain);
      appendMetaChip(meta, device.statusText, `status ${statusClass(device.statusText, device.statusKind)}`);
      appendMetaChip(meta, device.owner);
      panel.appendChild(meta);
      const kv = document.createElement("div");
      kv.className = "kv";
      [
        ["板类型", device.boardType],
        ["CPU", device.cpu],
        ["Slot", device.slot],
        ["Telnet", device.telnet],
        ["SSH", device.ssh],
        ["串口", device.serial || "占用后可见"]
      ].forEach(([key, value]) => {
        const keyEl = document.createElement("div");
        keyEl.className = "key";
        keyEl.textContent = key;
        const valueEl = document.createElement("div");
        valueEl.className = "value";
        valueEl.textContent = value || "-";
        valueEl.title = value || "-";
        kv.appendChild(keyEl);
        kv.appendChild(valueEl);
      });
      panel.appendChild(kv);
    }

    function sessionContextPoint(item) {
      const rect = item.getBoundingClientRect();
      return {
        x: Math.round(rect.left + Math.min(rect.width - 8, 32)),
        y: Math.round(rect.top + rect.height / 2)
      };
    }

    function requestSessionContext(item, session, event) {
      if (!bridge) return;
      if (event) event.preventDefault();
      const point = event && Number.isFinite(event.clientX) && Number.isFinite(event.clientY)
        ? { x: event.clientX, y: event.clientY }
        : sessionContextPoint(item);
      bridge.requestSessionContextMenu(session.tabId, point.x, point.y);
    }

    function renderSessions(sessions) {
      const list = $("sessionList");
      list.innerHTML = "";
      if (!sessions.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "当前没有打开终端会话。";
        list.appendChild(empty);
        return;
      }
      sessions.forEach((session) => {
        const item = document.createElement("div");
        item.className = `session ${session.active ? "active" : ""}`.trim();
        item.tabIndex = 0;
        item.setAttribute("role", "button");
        item.setAttribute("aria-label", session.title || session.tabId || "");
        item.setAttribute("aria-current", session.active ? "true" : "false");
        const left = document.createElement("div");
        const title = document.createElement("div");
        title.className = "session-title";
        title.textContent = session.title;
        const sub = document.createElement("div");
        sub.className = "session-sub";
        sub.textContent = `${session.deviceName} / ${session.kind}`;
        left.appendChild(title);
        left.appendChild(sub);
        const status = document.createElement("div");
        status.className = `session-status ${sessionStatusClass(session.status)}`;
        status.textContent = session.statusLabel || session.status;
        item.appendChild(left);
        item.appendChild(status);
        item.addEventListener("click", () => bridge && bridge.selectSession(session.tabId));
        item.addEventListener("contextmenu", (event) => requestSessionContext(item, session, event));
        item.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            if (bridge) bridge.selectSession(session.tabId);
          } else if (event.key === "ContextMenu" || (event.shiftKey && event.key === "F10")) {
            requestSessionContext(item, session, event);
          }
        });
        list.appendChild(item);
      });
    }

    window.setWebShellPayload = function setWebShellPayload(payload) {
      state = payload || {};
      applying = true;
      setOptions($("domain"), state.domains || [], state.filters && state.filters.domain || "");
      setOptions($("status"), state.statuses || [], state.filters && state.filters.status || "");
      $("search").value = state.filters && state.filters.search || "";
      $("cpu").value = state.filters && state.filters.cpu || "";
      $("mine").classList.toggle("active", !!(state.filters && state.filters.mine));
      $("mine").textContent = `我的 ${state.stats && state.stats.mine || 0}`;
      $("clear").disabled = !state.hasFilters;
      $("summary").textContent = state.summary || "当前显示全部设备";
      const sessionCount = state.sessions ? state.sessions.length : 0;
      $("sessionsWorkspace").disabled = sessionCount === 0;
      $("sessionsWorkspace").textContent = `终端会话 (${sessionCount})`;
      renderStats(state.stats || {}, state.sessions ? state.sessions.length : 0);
      renderDeviceRows(state.rows || []);
      renderDevice(state.selectedDevice || null);
      renderSessions(state.sessions || []);
      applying = false;
    };

    function wire() {
      $("refresh").addEventListener("click", () => bridge && bridge.requestRefresh());
      $("sessionsWorkspace").addEventListener("click", () => bridge && bridge.requestAction("sessions"));
      $("clear").addEventListener("click", () => bridge && bridge.clearFilters());
      ["search", "cpu"].forEach((id) => $(id).addEventListener("input", debounceFilters));
      ["domain", "status"].forEach((id) => $(id).addEventListener("change", debounceFilters));
      $("mine").addEventListener("click", () => {
        $("mine").classList.toggle("active");
        sendFilters();
      });
      document.querySelectorAll("[data-action]").forEach((button) => {
        button.addEventListener("click", () => {
          if (bridge) bridge.requestAction(button.getAttribute("data-action"));
        });
      });
    }

    new QWebChannel(qt.webChannelTransport, (channel) => {
      bridge = channel.objects.webShellBridge;
      wire();
    });
  </script>
</body>
</html>
