<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <link rel="stylesheet" href="assets/workspace-theme.css" />
  <title>Device Navigation</title>
  <style>
    .shell {
      height: 100vh;
      display: grid;
      grid-template-rows: auto auto auto 1fr;
      gap: 8px;
      background: var(--bg);
    }

    .toolbar,
    .filters,
    .stats,
    .table {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 10px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
      padding: 8px;
    }

    .filters {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 82px 72px;
      gap: 6px;
      padding: 8px;
    }

    .stats {
      display: grid;
      gap: 5px;
      padding: 8px;
    }

    .count-line {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      color: var(--muted);
      line-height: 1.35;
    }

    .count-line b {
      color: var(--text);
      font-weight: 800;
    }

    .idle { color: var(--accent); }
    .occupied { color: var(--warn); }
    .pipeline { color: var(--blue); }
    .other { color: var(--soft); }

    .summary {
      min-height: 18px;
      color: var(--muted);
      line-height: 1.4;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .table {
      min-height: 0;
      overflow: hidden;
      display: grid;
      grid-template-rows: 28px 1fr;
      background: var(--bg);
    }

    .thead,
    .row {
      display: grid;
      grid-template-columns: 50px minmax(104px, 1.45fr) minmax(76px, 1fr) 58px 70px 90px;
      align-items: center;
    }

    .thead {
      padding-right: 10px;
      font-weight: 700;
    }

    .cell {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 0 7px;
    }

    .tbody {
      min-height: 0;
      overflow: auto;
    }

    .row {
      min-height: 30px;
      cursor: pointer;
    }

    .row.group {
      min-height: 26px;
    }

    .row.group .muted {
      color: var(--soft);
      font-weight: 400;
    }

    .empty { padding: 18px 10px; line-height: 1.5; }
  </style>
</head>
<body class="workspace-compact-page">
  <main class="shell">
    <section class="toolbar">
      <input id="search" autocomplete="off" placeholder="搜索名称、ID、板卡、型号" />
      <button id="refresh" type="button">刷新</button>
      <button id="clear" type="button">清空</button>
    </section>
    <section class="filters">
      <select id="domain"></select>
      <select id="status"></select>
      <input id="cpu" autocomplete="off" placeholder="CPU" />
      <button id="mine" type="button">我的</button>
    </section>
    <section class="stats">
      <div class="count-line" id="counts"></div>
      <div class="summary" id="summary"></div>
    </section>
    <section class="table">
      <div class="thead">
        <div class="cell">序号</div>
        <div class="cell">设备</div>
        <div class="cell">板类型</div>
        <div class="cell">CPU</div>
        <div class="cell">Slot</div>
        <div class="cell">状态</div>
      </div>
      <div class="tbody" id="rows"></div>
    </section>
  </main>

  <script>
    let bridge = null;
    let applying = false;
    let filterTimer = null;
    const $ = (id) => document.getElementById(id);

    function debounceFilters() {
      if (applying || !bridge) return;
      window.clearTimeout(filterTimer);
      filterTimer = window.setTimeout(sendFilters, 80);
    }

    function sendFilters() {
      if (!bridge) return;
      bridge.updateFilters(JSON.stringify({
        search: $("search").value,
        domain: $("domain").value,
        status: $("status").value,
        cpu: $("cpu").value,
        mine: $("mine").classList.contains("active")
      }));
    }

    function setOptions(select, values, current) {
      select.innerHTML = "";
      (values || []).forEach((value) => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        select.appendChild(option);
      });
      select.value = current || "";
      if (select.value !== (current || "") && values && values.length) select.value = values[0];
    }

    function statusClass(status, kind) {
      if (kind) return kind;
      const value = String(status || "");
      if (value.includes("空闲")) return "idle";
      if (value.includes("占用") && !value.includes("流水线")) return "occupied";
      if (value.includes("流水线")) return "pipeline";
      return "other";
    }

    function appendCell(row, text, title, extraClass) {
      const cell = document.createElement("div");
      cell.className = `cell ${extraClass || ""}`.trim();
      cell.textContent = text || "";
      cell.title = title || text || "";
      row.appendChild(cell);
    }

    function rowContextPoint(row) {
      const rect = row.getBoundingClientRect();
      return {
        x: Math.round(rect.left + Math.min(rect.width - 8, 32)),
        y: Math.round(rect.top + rect.height / 2)
      };
    }

    function requestDeviceRowContext(row, item, event) {
      if (!bridge) return;
      if (event) event.preventDefault();
      const point = event && Number.isFinite(event.clientX) && Number.isFinite(event.clientY)
        ? { x: event.clientX, y: event.clientY }
        : rowContextPoint(row);
      bridge.requestDeviceContextMenu(item.id, point.x, point.y);
    }

    function wireDeviceRowKeyboard(row, item) {
      row.setAttribute("role", "button");
      row.setAttribute("aria-label", item.name || item.id || "");
      row.setAttribute("aria-selected", item.selected ? "true" : "false");
      row.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          if (bridge) bridge.selectDevice(item.id);
        } else if (event.key === "ContextMenu" || (event.shiftKey && event.key === "F10")) {
          requestDeviceRowContext(row, item, event);
        }
      });
    }

    function renderCounts(data) {
      $("counts").innerHTML = [
        `设备 <b>${data.stats.total}</b>`,
        `空闲 <b class="idle">${data.stats.idle}</b>`,
        `占用 <b class="occupied">${data.stats.occupied}</b>`,
        `流水线 <b class="pipeline">${data.stats.pipeline}</b>`,
        `其他 <b class="other">${data.stats.other}</b>`
      ].join("");
      $("summary").textContent = data.summary || "当前显示全部设备";
    }

    function renderRows(data) {
      const container = $("rows");
      container.innerHTML = "";
      if (!data.rows.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "没有符合条件的设备。";
        container.appendChild(empty);
        return;
      }
      data.rows.forEach((item) => {
        const row = document.createElement("div");
        row.className = item.kind === "group" ? "row group" : "row contextable";
        if (item.selected) row.classList.add("selected");
        if (item.kind === "group") {
          appendCell(row, item.name, item.name);
          appendCell(row, item.subdomain || "", item.subdomain || "", "muted");
          appendCell(row, `${item.count} 块板`, `${item.count} 块板`, "muted");
          appendCell(row, "", "");
          appendCell(row, "", "");
          appendCell(row, "", "");
          container.appendChild(row);
          return;
        }
        row.addEventListener("click", () => bridge && bridge.selectDevice(item.id));
        row.addEventListener("contextmenu", (event) => requestDeviceRowContext(row, item, event));
        row.tabIndex = 0;
        wireDeviceRowKeyboard(row, item);
        appendCell(row, item.boardId, item.boardId);
        appendCell(row, item.name, item.name);
        appendCell(row, item.boardType, item.boardType);
        appendCell(row, item.cpu, item.cpu);
        appendCell(row, item.slot, item.slot);
        appendCell(row, item.statusText, item.statusTooltip || item.statusText, `status ${statusClass(item.statusText, item.statusKind)}`);
        container.appendChild(row);
      });
    }

    window.setDeviceNavigationPayload = function setDeviceNavigationPayload(nextPayload) {
      const payload = nextPayload || {};
      applying = true;
      setOptions($("domain"), payload.domains || [], payload.filters.domain || "");
      setOptions($("status"), payload.statuses || [], payload.filters.status || "");
      $("search").value = payload.filters.search || "";
      $("cpu").value = payload.filters.cpu || "";
      $("mine").classList.toggle("active", !!payload.filters.mine);
      $("mine").textContent = `我的 ${payload.stats.mine || 0}`;
      $("clear").disabled = !payload.hasFilters;
      renderCounts(payload);
      renderRows(payload);
      applying = false;
    };

    function wire() {
      ["search", "cpu"].forEach((id) => $(id).addEventListener("input", debounceFilters));
      ["domain", "status"].forEach((id) => $(id).addEventListener("change", debounceFilters));
      $("mine").addEventListener("click", () => {
        $("mine").classList.toggle("active");
        sendFilters();
      });
      $("refresh").addEventListener("click", () => bridge && bridge.requestRefresh());
      $("clear").addEventListener("click", () => bridge && bridge.clearFilters());
    }

    new QWebChannel(qt.webChannelTransport, (channel) => {
      bridge = channel.objects.deviceNavigationBridge;
      wire();
    });
  </script>
</body>
</html>
