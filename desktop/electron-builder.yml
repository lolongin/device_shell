appId: com.odyterm.desktop
productName: OdyTerm
electronVersion: 43.3.0
electronDist: node_modules/electron/dist
compression: store
directories:
  output: release
files:
  - out/**
  - package.json
asar: true
asarUnpack:
  - resources/**
extraResources:
  - from: resources/credential-dialog.html
    to: credential-dialog.html
  - from: resources/backend
    to: backend
    filter:
      - '**/*'
  - from: resources/product-profile.json
    to: product-profile.json
win:
  icon: resources/odyterm-icon.ico
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
