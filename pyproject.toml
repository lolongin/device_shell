[project]
name = "device-tui"
version = "0.1.0"
description = "Desktop device dashboard with device inventory, occupancy, and dual-channel CLI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "asyncssh>=2.22,<3",
    "mcp>=1.27,<2",
    "PySide6-WebEngine>=6.7,<7",
    "telnetlib3>=4.0,<5",
    "pyftpdlib>=2.0,<3",
    "PySide6>=6.7,<7",
    "pyte>=0.8,<1",
]

[project.scripts]
device-tui = "src.desktop_app:main"
device-tui-desktop = "src.desktop_app:main"
device-tui-mcp = "src.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
src = [
    "web/*.html",
    "web/assets/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
