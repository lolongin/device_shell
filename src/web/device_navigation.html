<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <link rel="stylesheet" href="assets/workspace-theme.css" />
  <title>Terminal Navigation</title>
  <style>
    .shell {
      width: 100%;
      max-width: 100%;
      height: 100vh;
      min-height: 0;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 8px;
      background:
        radial-gradient(circle at 0 0, var(--home-glow-accent), transparent 34%),
        var(--bg);
    }

    .hero,
    .sessions,
    .current {
      min-width: 0;
      max-width: 100%;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 10px;
      overflow: hidden;
    }

    .hero {
      display: grid;
      gap: 8px;
      padding: 10px;
    }

    .eyebrow {
      color: var(--accent);
      font: 800 10px/1.2 "Cascadia Mono", Consolas, monospace;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .title {
      font-size: 16px;
      font-weight: 800;
    }

    .copy {
      color: var(--muted);
      line-height: 1.45;
    }

    .counts {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }

    .metric {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--input);
      padding: 7px 8px;
    }

    .metric b {
      display: block;
      color: var(--text);
      font-size: 16px;
      line-height: 1;
    }

    .metric span {
      display: block;
      margin-top: 4px;
      color: var(--soft);
      white-space: nowrap;
    }

    .sessions {
      min-height: 0;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .head {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 10px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-2);
    }

    .head-title {
      font-weight: 800;
    }

    .session-list {
      min-height: 0;
      overflow: auto;
      padding: 8px;
      display: grid;
      align-content: start;
      gap: 7px;
    }

    .session {
      min-width: 0;
      max-width: 100%;
      min-height: 62px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--input);
      padding: 8px 9px;
      cursor: pointer;
    }

    .session:hover,
    .session.active {
      border-color: var(--success-line);
      background: var(--success-soft);
    }

    .session-title,
    .session-sub {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .session-title {
      font-weight: 800;
    }

    .session-sub {
      margin-top: 4px;
      color: var(--muted);
    }

    .status-pill {
      justify-self: end;
      min-width: 58px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 8px;
      text-align: center;
      font-weight: 800;
      color: var(--soft);
    }

    .status-pill.connected {
      color: var(--accent);
      border-color: var(--status-idle-line);
      background: var(--status-idle-soft);
    }

    .status-pill.connecting {
      color: var(--blue);
      border-color: var(--status-pipeline-line);
      background: var(--status-pipeline-soft);
    }

    .status-pill.disconnected {
      color: var(--danger);
      border-color: var(--danger-line);
      background: var(--danger-soft);
    }

    .current {
      display: grid;
      gap: 7px;
      padding: 10px;
    }

    .device-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 800;
    }

    .device-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .chip {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px 7px;
    }

    .actions {
      min-width: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .actions button {
      min-width: 0;
      width: 100%;
      padding-inline: 8px;
    }

    .empty {
      padding: 14px 10px;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    @media (max-width: 320px) {
      .shell {
        gap: 7px;
      }

      .hero,
      .current {
        padding: 9px;
      }

      .metric {
        padding-inline: 6px;
      }

      .metric span {
        white-space: normal;
      }

      .session {
        grid-template-columns: minmax(0, 1fr);
        gap: 6px;
      }

      .status-pill {
        justify-self: start;
        min-width: 0;
        padding-inline: 7px;
      }

      .device-meta {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .chip,
      .device-meta .status {
        min-width: 0;
        max-width: 100%;
      }
    }
  </style>
</head>
<body class="workspace-compact-page">
  <main class="shell">
    <section class="hero">
      <div>
        <div class="eyebrow">Terminal Workspace</div>
        <div class="title">终端导航</div>
        <div class="copy" id="summary">已打开终端会话会显示在这里。</div>
      </div>
      <div class="counts">
        <div class="metric"><b id="connected">0</b><span>已连接</span></div>
        <div class="metric"><b id="connecting">0</b><span>连接中</span></div>
        <div class="metric"><b id="disconnected">0</b><span>未连接</span></div>
      </div>
    </section>

    <section class="sessions">
      <div class="head">
        <div>
          <div class="head-title">会话列表</div>
          <div class="copy">点击会话可跳转到对应终端。</div>
        </div>
      </div>
      <div class="session-list" id="sessions"></div>
    </section>

    <section class="current" id="currentDevice"></section>

    <div class="actions">
      <button id="home" type="button">首页大屏</button>
      <button id="refresh" type="button">刷新</button>
    </div>
  </main>

  <script>
    let bridge = null;
    const $ = (id) => document.getElementById(id);

    function sessionStatusClass(status) {
      const normalized = String(status || "").toLowerCase();
      if (normalized === "connected") return "connected";
      if (normalized === "connecting") return "connecting";
      if (normalized === "disconnected") return "disconnected";
      return "";
    }

    function addChip(container, text, extraClass) {
      if (!text) return;
      const chip = document.createElement("span");
      chip.className = `${extraClass || "chip"}`.trim();
      chip.textContent = text;
      chip.title = text;
      container.appendChild(chip);
    }

    function sessionContextPoint(item) {
      const rect = item.getBoundingClientRect();
      return {
        x: Math.round(rect.left + Math.min(rect.width - 8, 32)),
        y: Math.round(rect.top + rect.height / 2)
      };
    }

    function requestSessionContext(item, session, event) {
      if (!bridge) return;
      if (event) event.preventDefault();
      const point = event && Number.isFinite(event.clientX) && Number.isFinite(event.clientY)
        ? { x: event.clientX, y: event.clientY }
        : sessionContextPoint(item);
      bridge.requestSessionContextMenu(session.tabId, point.x, point.y);
    }

    function renderSessions(sessions) {
      const list = $("sessions");
      list.innerHTML = "";
      if (!sessions.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "当前没有打开的终端会话。请先在首页选择设备并连接 Telnet、SSH 或串口。";
        list.appendChild(empty);
        return;
      }
      sessions.forEach((session) => {
        const item = document.createElement("div");
        item.className = `session ${session.active ? "active" : ""}`.trim();
        item.tabIndex = 0;
        item.setAttribute("role", "button");
        item.setAttribute("aria-label", session.title || session.tabId || "");
        item.setAttribute("aria-current", session.active ? "true" : "false");

        const text = document.createElement("div");
        const title = document.createElement("div");
        title.className = "session-title";
        title.textContent = session.title || "";
        const sub = document.createElement("div");
        sub.className = "session-sub";
        sub.textContent = `${session.deviceName || session.deviceId || "-"} / ${session.kind || "-"} / ${session.host || "-"}`;
        text.appendChild(title);
        text.appendChild(sub);

        const status = document.createElement("div");
        status.className = `status-pill ${sessionStatusClass(session.status)}`.trim();
        status.textContent = session.statusLabel || session.status || "-";

        item.appendChild(text);
        item.appendChild(status);
        item.addEventListener("click", () => bridge && bridge.selectSession(session.tabId));
        item.addEventListener("contextmenu", (event) => requestSessionContext(item, session, event));
        item.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            if (bridge) bridge.selectSession(session.tabId);
          } else if (event.key === "ContextMenu" || (event.shiftKey && event.key === "F10")) {
            requestSessionContext(item, session, event);
          }
        });
        list.appendChild(item);
      });
    }

    function renderCurrentDevice(device) {
      const panel = $("currentDevice");
      panel.innerHTML = "";
      if (!device) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "当前没有选中设备。回到首页大屏选择设备后，再打开终端。";
        panel.appendChild(empty);
        return;
      }
      const title = document.createElement("div");
      title.className = "device-name";
      title.textContent = device.name || "";
      panel.appendChild(title);
      const meta = document.createElement("div");
      meta.className = "device-meta";
      addChip(meta, device.id);
      addChip(meta, device.boardType);
      addChip(meta, device.cpu);
      addChip(meta, device.slot);
      addChip(meta, device.statusText, `status ${device.statusKind || "other"}`);
      panel.appendChild(meta);
    }

    window.setDeviceNavigationPayload = function setDeviceNavigationPayload(payload) {
      const data = payload || {};
      const stats = data.stats || {};
      $("summary").textContent = data.summary || "0 个终端会话";
      $("connected").textContent = stats.connected || 0;
      $("connecting").textContent = stats.connecting || 0;
      $("disconnected").textContent = stats.disconnected || 0;
      renderSessions(data.sessions || []);
      renderCurrentDevice(data.selectedDevice || null);
    };

    function wire() {
      $("home").addEventListener("click", () => bridge && bridge.requestHome());
      $("refresh").addEventListener("click", () => bridge && bridge.requestRefresh());
    }

    new QWebChannel(qt.webChannelTransport, (channel) => {
      bridge = channel.objects.deviceNavigationBridge;
      wire();
    });
  </script>
</body>
</html>
