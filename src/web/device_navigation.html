<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <link rel="stylesheet" href="assets/workspace-theme.css" />
  <title>Terminal Navigation</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font: 12px/1.45 "Microsoft YaHei UI", "Segoe UI", sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .shell {
      width: 100%;
      height: 100vh;
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      gap: 6px;
      padding: 0;
      background: var(--bg);
    }

    .topbar,
    .tabs,
    .panel,
    .footer {
      min-width: 0;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
    }

    .topbar {
      display: grid;
      gap: 2px;
      padding: 6px 9px;
    }

    .eyebrow {
      color: var(--accent);
      font: 800 10px/1.2 "Cascadia Mono", Consolas, monospace;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .title-row {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 15px;
      font-weight: 800;
    }

    .summary {
      margin-left: auto;
      color: var(--soft);
      white-space: nowrap;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 4px;
      padding: 4px;
      background: var(--panel-2);
    }

    .tab {
      min-width: 0;
      height: 28px;
      border-radius: 6px;
      color: var(--muted);
      border: 1px solid transparent;
      background: transparent;
      cursor: pointer;
    }

    .tab.active {
      color: var(--text);
      border-color: var(--status-pipeline-line);
      background: var(--input);
      font-weight: 800;
    }

    .panel {
      min-height: 0;
      overflow: hidden;
      display: none;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .panel.active {
      display: grid;
    }

    .panel-head {
      min-width: 0;
      display: grid;
      gap: 5px;
      padding: 6px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-2);
    }

    .panel-title-row,
    .row-main,
    .session-main,
    .row-actions,
    .device-actions,
    .search-row {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .panel-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 800;
    }

    .head-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .ghost {
      min-width: 0;
      height: 26px;
      padding: 0 8px;
      border-radius: 6px;
      color: var(--muted);
      border: 1px solid var(--line);
      background: var(--input);
      cursor: pointer;
      white-space: nowrap;
    }

    .ghost:hover,
    .ghost:focus-visible {
      color: var(--text);
      border-color: var(--status-pipeline-line);
      box-shadow: none;
    }

    .ghost.danger:hover,
    .ghost.danger:focus-visible {
      color: var(--danger);
      border-color: var(--danger-line);
      background: var(--danger-soft);
    }

    .ghost:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .search-input {
      min-width: 0;
      width: 100%;
      height: 28px;
      padding: 0 9px;
      border-radius: 7px;
      border: 1px solid var(--line);
      color: var(--text);
      background: var(--input);
      outline: none;
    }

    .search-input:focus {
      border-color: var(--status-pipeline-line);
    }

    .list {
      min-height: 0;
      overflow: auto;
      display: grid;
      align-content: start;
      gap: 5px;
      padding: 6px;
    }

    .session,
    .device {
      min-width: 0;
      display: grid;
      gap: 5px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--input);
      cursor: pointer;
    }

    .counts {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }

    .metric:last-child {
      grid-column: auto;
    }

    .session:hover,
    .session.active,
    .device:hover,
    .device.selected {
      border-color: var(--success-line);
      background: var(--success-soft);
    }

    .name-stack {
      min-width: 0;
      display: grid;
      gap: 1px;
    }

    .name,
    .sub {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .name {
      font-weight: 800;
    }

    .sub {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.25;
    }

    .pill-row {
      min-width: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .session-meta {
      min-width: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .pill {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 6px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.02);
    }

    .status {
      font-weight: 800;
    }

    .status.connected,
    .status.idle {
      color: var(--accent);
      border-color: var(--status-idle-line);
      background: var(--status-idle-soft);
    }

    .status.connecting,
    .status.pipeline {
      color: var(--blue);
      border-color: var(--status-pipeline-line);
      background: var(--status-pipeline-soft);
    }

    .status.disconnected,
    .status.occupied {
      color: var(--danger);
      border-color: var(--danger-line);
      background: var(--danger-soft);
    }

    .row-actions,
    .device-actions {
      justify-content: stretch;
    }

    .row-actions .ghost,
    .device-actions .ghost {
      flex: 1 1 0;
      padding: 0 6px;
    }

    .icon-btn {
      width: 24px;
      height: 24px;
      padding: 0;
      border-radius: 6px;
      line-height: 1;
    }

    .session-close {
      width: 24px;
      height: 24px;
      padding: 0;
      border-radius: 6px;
      line-height: 1;
      color: var(--muted);
      border: 1px solid var(--line);
      background: var(--input);
      cursor: pointer;
    }

    .session-close:hover,
    .session-close:focus-visible {
      color: var(--danger);
      border-color: var(--danger-line);
      background: var(--danger-soft);
      box-shadow: none;
    }

    .details {
      display: none;
      min-width: 0;
      color: var(--muted);
      white-space: pre-line;
      overflow-wrap: anywhere;
      border-top: 1px dashed var(--line);
      padding-top: 6px;
    }

    .device.expanded .details {
      display: block;
    }

    .empty {
      padding: 14px 10px;
      color: var(--muted);
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    .footer {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 5px;
      align-items: center;
      padding: 5px 6px;
      background: var(--panel-2);
    }

    .footer-text {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
    }

    .actions button {
      min-width: 0;
    }

    @media (max-width: 340px) {
      .head-actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        width: 100%;
        margin-left: 0;
      }

      .panel-title-row {
        flex-wrap: wrap;
      }

      .row-actions,
      .device-actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 420px) {
      .counts {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .metric:last-child {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>
<body class="workspace-compact-page">
  <main class="shell">
    <section class="topbar">
      <div class="eyebrow">Terminal Workspace</div>
      <div class="title-row">
        <div class="title">终端导航</div>
        <div class="summary" id="summary">0 会话</div>
      </div>
    </section>

    <nav class="tabs" aria-label="终端导航页签">
      <button class="tab" id="tabSessions" type="button" data-tab="sessions">会话</button>
      <button class="tab" id="tabDevices" type="button" data-tab="devices">设备</button>
    </nav>

    <section class="panel" id="sessionsPanel" aria-label="会话列表">
      <div class="panel-head">
        <div class="panel-title-row">
          <div class="panel-title">会话列表</div>
          <div class="head-actions">
            <button class="ghost danger" id="closeCurrent" type="button">关当前</button>
            <button class="ghost danger" id="closeOthers" type="button">关其他</button>
            <button class="ghost danger" id="closeAll" type="button">全关闭</button>
          </div>
        </div>
      </div>
      <div class="list" id="sessions"></div>
    </section>

    <section class="panel" id="devicesPanel" aria-label="设备列表">
      <div class="panel-head">
        <div class="search-row">
          <input class="search-input" id="deviceSearch" type="search" autocomplete="off"
            placeholder="搜索设备名、ID、IP" />
        </div>
        <div class="panel-title-row">
          <div class="panel-title" id="deviceModeTitle">常用设备</div>
          <div class="head-actions">
            <button class="ghost" id="clearSearch" type="button">清空</button>
          </div>
        </div>
      </div>
      <div class="list" id="devices"></div>
    </section>

    <footer class="footer">
      <div class="footer-text" id="footerText">设备搜索仅影响此导航栏</div>
      <div class="actions">
        <button class="ghost" id="home" type="button">首页</button>
        <button class="ghost" id="refresh" type="button">刷新</button>
      </div>
    </footer>
  </main>

  <script>
    let bridge = null;
    let payload = {
      sessions: [],
      devices: [],
      defaultDeviceIds: [],
      navigationState: {}
    };
    let activeTab = "devices";
    let deviceQuery = "";
    let expandedDeviceId = "";
    const MAX_SEARCH_RESULTS = 80;
    const $ = (id) => document.getElementById(id);

    function normalize(value) {
      return String(value || "").trim().toLowerCase();
    }

    function statusClass(status) {
      const value = normalize(status);
      if (value === "connected" || value.includes("已连接") || value.includes("空闲")) return "connected idle";
      if (value === "connecting" || value.includes("连接中") || value.includes("流水线")) return "connecting pipeline";
      if (value === "disconnected" || value.includes("未连接") || value.includes("占用")) return "disconnected occupied";
      return "";
    }

    function activeSession() {
      return (payload.sessions || []).find((session) => session.active) || (payload.sessions || [])[0] || null;
    }

    function emitNavigationState() {
      if (!bridge) return;
      bridge.updateNavigationState(JSON.stringify({
        activeTab,
        deviceQuery,
        expandedDeviceId
      }));
    }

    function setActiveTab(tab, emit = true) {
      activeTab = tab === "sessions" ? "sessions" : "devices";
      $("tabSessions").classList.toggle("active", activeTab === "sessions");
      $("tabDevices").classList.toggle("active", activeTab === "devices");
      $("sessionsPanel").classList.toggle("active", activeTab === "sessions");
      $("devicesPanel").classList.toggle("active", activeTab === "devices");
      if (emit) emitNavigationState();
    }

    function addPill(container, text, className = "") {
      if (!text) return;
      const pill = document.createElement("span");
      pill.className = `pill ${className}`.trim();
      pill.textContent = text;
      pill.title = text;
      container.appendChild(pill);
    }

    function sessionPoint(item) {
      const rect = item.getBoundingClientRect();
      return {
        x: Math.round(rect.left + Math.min(rect.width - 8, 32)),
        y: Math.round(rect.top + rect.height / 2)
      };
    }

    function requestSessionContext(item, session, event) {
      if (!bridge) return;
      if (event) event.preventDefault();
      const point = event && Number.isFinite(event.clientX) && Number.isFinite(event.clientY)
        ? { x: event.clientX, y: event.clientY }
        : sessionPoint(item);
      bridge.requestSessionContextMenu(session.tabId, point.x, point.y);
    }

    function requestDeviceContext(item, device, event) {
      if (!bridge) return;
      if (event) event.preventDefault();
      const rect = item.getBoundingClientRect();
      const x = event && Number.isFinite(event.clientX)
        ? event.clientX
        : Math.round(rect.left + Math.min(rect.width - 8, 32));
      const y = event && Number.isFinite(event.clientY)
        ? event.clientY
        : Math.round(rect.top + rect.height / 2);
      bridge.requestDeviceContextMenu(device.id, x, y);
    }

    function renderSessions() {
      const sessions = payload.sessions || [];
      const list = $("sessions");
      list.innerHTML = "";
      const current = activeSession();
      $("closeCurrent").disabled = !current;
      $("closeOthers").disabled = !current || sessions.length <= 1;
      $("closeAll").disabled = sessions.length === 0;
      if (!sessions.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "当前没有打开的终端会话。";
        list.appendChild(empty);
        return;
      }
      sessions.forEach((session) => {
        const item = document.createElement("article");
        item.className = `session ${session.active ? "active" : ""}`.trim();
        item.tabIndex = 0;
        item.setAttribute("role", "button");
        item.setAttribute("aria-current", session.active ? "true" : "false");
        item.title = `${session.deviceName || session.deviceId || ""}\n${session.host || ""}`;

        const main = document.createElement("div");
        main.className = "session-main";
        const text = document.createElement("div");
        text.className = "name-stack";
        const title = document.createElement("div");
        title.className = "name";
        title.textContent = session.title || session.tabId || "";
        const sub = document.createElement("div");
        sub.className = "sub";
        sub.textContent = session.deviceName || session.deviceId || "-";
        text.appendChild(title);
        text.appendChild(sub);

        const close = document.createElement("button");
        close.className = "session-close";
        close.type = "button";
        close.textContent = "×";
        close.title = "关闭会话";
        close.addEventListener("click", (event) => {
          event.preventDefault();
          event.stopPropagation();
          if (bridge) bridge.closeSession(session.tabId);
        });

        main.appendChild(text);
        main.appendChild(close);

        const meta = document.createElement("div");
        meta.className = "session-meta";
        addPill(meta, session.kind || "-");
        addPill(meta, session.host || "-");
        addPill(meta, session.statusLabel || session.status || "-", `status ${statusClass(session.status)}`);

        item.appendChild(main);
        item.appendChild(meta);
        item.addEventListener("click", () => bridge && bridge.selectSession(session.tabId));
        item.addEventListener("contextmenu", (event) => requestSessionContext(item, session, event));
        item.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            if (bridge) bridge.selectSession(session.tabId);
          } else if (event.key === "ContextMenu" || (event.shiftKey && event.key === "F10")) {
            requestSessionContext(item, session, event);
          }
        });
        list.appendChild(item);
      });
    }

    function defaultDeviceRows() {
      const devices = payload.devices || [];
      const byId = new Map(devices.map((device) => [device.id, device]));
      const rows = [];
      (payload.defaultDeviceIds || []).forEach((id) => {
        const device = byId.get(id);
        if (device && !rows.includes(device)) rows.push(device);
      });
      return rows;
    }

    function searchedDeviceRows() {
      const query = normalize(deviceQuery);
      if (!query) return defaultDeviceRows();
      const terms = query.split(/\s+/).filter(Boolean);
      return (payload.devices || [])
        .filter((device) => {
          const haystack = normalize([
            device.searchText,
            device.name,
            device.id,
            device.shortIdentity,
            device.boardId,
            device.boardType,
            device.cpu,
            device.slot,
            device.telnet,
            device.ssh,
            device.serial
          ].join(" "));
          return terms.every((term) => haystack.includes(term));
        })
        .slice(0, MAX_SEARCH_RESULTS);
    }

    function connectDevice(deviceId, kind, event) {
      event.preventDefault();
      event.stopPropagation();
      if (bridge) bridge.requestDeviceConnect(deviceId, kind);
    }

    function toggleDeviceDetails(deviceId, event) {
      event.preventDefault();
      event.stopPropagation();
      expandedDeviceId = expandedDeviceId === deviceId ? "" : deviceId;
      emitNavigationState();
      renderDevices();
    }

    function renderDevices(rows) {
      rows = rows || searchedDeviceRows();
      const list = $("devices");
      list.innerHTML = "";
      const query = normalize(deviceQuery);
      $("deviceModeTitle").textContent = query
        ? `搜索结果 ${rows.length}/${payload.deviceTotal || (payload.devices || []).length}`
        : "常用 / 相关设备";
      $("clearSearch").disabled = !query;
      if (!rows.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = query
          ? "没有匹配的设备。可以试试设备名、短 ID 或 IP。"
          : "暂无常用设备。打开或选择设备后会出现在这里。";
        list.appendChild(empty);
        return;
      }
      rows.forEach((device) => {
        const item = document.createElement("article");
        item.className = `device ${device.selected ? "selected" : ""} ${expandedDeviceId === device.id ? "expanded" : ""}`.trim();
        item.tabIndex = 0;
        item.setAttribute("role", "button");
        item.setAttribute("aria-selected", device.selected ? "true" : "false");
        item.title = device.detail || device.name || "";

        const main = document.createElement("div");
        main.className = "row-main";
        const text = document.createElement("div");
        text.className = "name-stack";
        const name = document.createElement("div");
        name.className = "name";
        name.textContent = device.name || device.id || "";
        const sub = document.createElement("div");
        sub.className = "sub";
        sub.textContent = device.shortIdentity || device.id || "-";
        text.appendChild(name);
        text.appendChild(sub);

        const detailsButton = document.createElement("button");
        detailsButton.className = "ghost icon-btn";
        detailsButton.type = "button";
        detailsButton.textContent = expandedDeviceId === device.id ? "−" : "+";
        detailsButton.title = expandedDeviceId === device.id ? "收起详情" : "展开详情";
        detailsButton.addEventListener("click", (event) => toggleDeviceDetails(device.id, event));
        main.appendChild(text);
        main.appendChild(detailsButton);

        const meta = document.createElement("div");
        meta.className = "pill-row";
        addPill(meta, device.statusText || "-", `status ${device.statusKind || ""} ${statusClass(device.statusText)}`);
        addPill(meta, device.telnet || device.ssh || device.serial || "-");

        const actions = document.createElement("div");
        actions.className = "device-actions";
        [
          ["telnet", "Telnet", !!device.telnet],
          ["ssh", "SSH", !!device.ssh],
          ["serial", "串口", !!device.canSerial]
        ].forEach(([kind, label, enabled]) => {
          const button = document.createElement("button");
          button.className = "ghost";
          button.type = "button";
          button.textContent = label;
          button.disabled = !enabled;
          button.title = enabled ? `${label} ${device.name}` : `${label} 不可用`;
          button.addEventListener("click", (event) => connectDevice(device.id, kind, event));
          actions.appendChild(button);
        });

        const details = document.createElement("div");
        details.className = "details";
        details.textContent = device.detail || "没有更多详情。";

        item.appendChild(main);
        item.appendChild(meta);
        item.appendChild(actions);
        item.appendChild(details);
        item.addEventListener("click", () => bridge && bridge.selectDevice(device.id));
        item.addEventListener("contextmenu", (event) => requestDeviceContext(item, device, event));
        item.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            if (bridge) bridge.selectDevice(device.id);
          } else if (event.key === "ArrowRight") {
            expandedDeviceId = device.id;
            emitNavigationState();
            renderDevices();
          } else if (event.key === "ArrowLeft") {
            expandedDeviceId = "";
            emitNavigationState();
            renderDevices();
          } else if (event.key === "ContextMenu" || (event.shiftKey && event.key === "F10")) {
            requestDeviceContext(item, device, event);
          }
        });
        list.appendChild(item);
      });
    }

    function renderFooter() {
      const sessions = payload.sessions || [];
      const devices = payload.devices || [];
      const current = activeSession();
      $("summary").textContent = `${sessions.length} 会话`;
      $("footerText").textContent = current
        ? `${current.deviceName || current.deviceId || "当前设备"} · ${current.title || ""}`
        : `${devices.length} 台设备可搜索`;
    }

    function renderAll() {
      renderFooter();
      renderSessions();
      renderDevices();
      setActiveTab(activeTab, false);
    }

    window.setDeviceNavigationPayload = function setDeviceNavigationPayload(nextPayload) {
      payload = nextPayload || {};
      const state = payload.navigationState || {};
      activeTab = state.activeTab === "sessions" ? "sessions" : "devices";
      deviceQuery = String(state.deviceQuery || "");
      expandedDeviceId = String(state.expandedDeviceId || "");
      $("deviceSearch").value = deviceQuery;
      renderAll();
    };

    function wire() {
      $("tabSessions").addEventListener("click", () => setActiveTab("sessions"));
      $("tabDevices").addEventListener("click", () => setActiveTab("devices"));
      $("deviceSearch").addEventListener("input", (event) => {
        deviceQuery = event.target.value || "";
        emitNavigationState();
        renderDevices();
        renderFooter();
      });
      $("clearSearch").addEventListener("click", () => {
        deviceQuery = "";
        $("deviceSearch").value = "";
        emitNavigationState();
        renderDevices();
      });
      $("closeCurrent").addEventListener("click", () => {
        const current = activeSession();
        if (current && bridge) bridge.closeSession(current.tabId);
      });
      $("closeOthers").addEventListener("click", () => {
        const current = activeSession();
        if (current && bridge) bridge.closeOtherSessions(current.tabId);
      });
      $("closeAll").addEventListener("click", () => bridge && bridge.closeAllSessions());
      $("home").addEventListener("click", () => bridge && bridge.requestHome());
      $("refresh").addEventListener("click", () => bridge && bridge.requestRefresh());
    }

    new QWebChannel(qt.webChannelTransport, (channel) => {
      bridge = channel.objects.deviceNavigationBridge;
      wire();
      renderAll();
    });
  </script>
</body>
</html>
