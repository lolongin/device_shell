<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <title>Auto Response Editor</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07090c;
      --panel: #0d1117;
      --panel-2: #111720;
      --line: #242b36;
      --line-strong: #334155;
      --text: #edf4ff;
      --muted: #9aa8bc;
      --soft: #6f7c91;
      --accent: #34d399;
      --accent-2: #60a5fa;
      --danger: #f87171;
      --focus: rgba(96, 165, 250, 0.35);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
      font-size: 13px;
    }

    body { overflow: hidden; }

    button,
    input,
    select {
      font: inherit;
    }

    .shell {
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
      background: var(--bg);
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(240px, 1fr) 180px 180px;
      gap: 10px;
      padding: 16px 18px 12px;
      border-bottom: 1px solid var(--line);
      background: #090c10;
    }

    .field {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    label,
    .caption {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
    }

    input,
    select {
      width: 100%;
      min-width: 0;
      height: 34px;
      color: var(--text);
      background: #090d13;
      border: 1px solid var(--line);
      border-radius: 6px;
      outline: none;
      padding: 0 10px;
    }

    input:focus,
    select:focus {
      border-color: var(--accent-2);
      box-shadow: 0 0 0 3px var(--focus);
    }

    .main {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 260px;
      gap: 12px;
      padding: 14px 18px 18px;
    }

    .steps {
      min-height: 0;
      overflow: auto;
      padding-right: 4px;
    }

    .step {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      margin-bottom: 10px;
      overflow: hidden;
    }

    .step-head {
      display: grid;
      grid-template-columns: auto minmax(220px, 1fr) 120px auto;
      align-items: end;
      gap: 10px;
      padding: 12px;
      background: var(--panel-2);
      border-bottom: 1px solid var(--line);
    }

    .step-index {
      min-width: 58px;
      color: var(--accent);
      font-weight: 700;
      padding-bottom: 8px;
    }

    .step-delay input {
      text-align: right;
    }

    .actions {
      display: grid;
      gap: 8px;
      padding: 10px 12px 12px 70px;
    }

    .action {
      display: grid;
      grid-template-columns: 128px minmax(160px, 1fr) 96px 92px auto;
      gap: 8px;
      align-items: end;
    }

    .inline-check {
      height: 34px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text);
      border: 1px solid var(--line);
      background: #090d13;
      border-radius: 6px;
      padding: 0 9px;
      white-space: nowrap;
    }

    .inline-check input {
      width: 15px;
      height: 15px;
      accent-color: var(--accent);
      padding: 0;
    }

    .action.first-action .action-delay-field input {
      color: var(--soft);
      border-color: #1c2430;
      background: #080b10;
    }

    .side {
      min-height: 0;
      display: grid;
      align-content: start;
      gap: 10px;
    }

    .panel {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      padding: 12px;
    }

    .panel-title {
      color: var(--text);
      font-weight: 700;
      margin-bottom: 10px;
    }

    .checks {
      display: grid;
      gap: 10px;
    }

    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
    }

    .check input {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      padding: 0;
    }

    .num-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 2px;
    }

    button {
      height: 32px;
      padding: 0 12px;
      color: var(--text);
      background: #0b1017;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover {
      border-color: var(--accent-2);
      background: #111827;
    }

    button.primary {
      border-color: rgba(52, 211, 153, 0.65);
      color: #d8fff0;
      background: rgba(16, 185, 129, 0.12);
    }

    button.danger {
      color: #ffd7d7;
      border-color: rgba(248, 113, 113, 0.45);
    }

    .muted {
      color: var(--muted);
      line-height: 1.55;
    }

    .hint {
      color: var(--soft);
      line-height: 1.55;
      margin-top: 8px;
    }

    .flow-preview {
      display: grid;
      gap: 10px;
      max-height: 260px;
      overflow: auto;
      padding-right: 2px;
    }

    .flow-step {
      position: relative;
      display: grid;
      gap: 8px;
      padding-left: 18px;
    }

    .flow-step::before {
      content: "";
      position: absolute;
      left: 5px;
      top: 16px;
      bottom: -11px;
      width: 1px;
      background: var(--line-strong);
    }

    .flow-step:last-child::before {
      display: none;
    }

    .flow-dot {
      position: absolute;
      left: 0;
      top: 5px;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.14);
    }

    .flow-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--text);
      font-weight: 700;
      line-height: 1.35;
    }

    .flow-wait {
      color: var(--muted);
      border: 1px solid var(--line);
      background: #090d13;
      border-radius: 6px;
      padding: 7px 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .flow-delay {
      color: #f8e7a1;
      font-size: 12px;
      white-space: nowrap;
    }

    .flow-actions {
      display: grid;
      gap: 5px;
    }

    .flow-action {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px;
      align-items: center;
      border: 1px solid #1d2633;
      background: #0a0f16;
      border-radius: 6px;
      padding: 6px 7px;
    }

    .flow-command {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text);
    }

    .flow-meta {
      display: flex;
      justify-content: flex-end;
      gap: 4px;
      min-width: 0;
    }

    .flow-chip {
      max-width: 84px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 6px;
      font-size: 11px;
      line-height: 1.3;
    }

    .flow-chip.enter {
      color: #d8fff0;
      border-color: rgba(52, 211, 153, 0.45);
      background: rgba(52, 211, 153, 0.08);
    }

    .empty-flow {
      color: var(--soft);
      line-height: 1.5;
    }

    .preview-entry {
      display: grid;
      gap: 8px;
    }

    .preview-summary {
      color: var(--muted);
      line-height: 1.45;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 28px;
      background: rgba(0, 0, 0, 0.58);
      z-index: 20;
    }

    .modal-backdrop.open {
      display: grid;
    }

    .modal {
      width: min(680px, 100%);
      max-height: min(720px, calc(100vh - 56px));
      display: grid;
      grid-template-rows: auto 1fr;
      border: 1px solid var(--line-strong);
      background: #090d13;
      border-radius: 8px;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-2);
    }

    .modal-title {
      font-weight: 700;
      color: var(--text);
    }

    .modal-body {
      min-height: 0;
      overflow: auto;
      padding: 14px;
    }

    .modal .flow-preview {
      max-height: none;
      overflow: visible;
    }

    @media (max-width: 860px) {
      .topbar,
      .main {
        grid-template-columns: 1fr;
      }

      .main {
        overflow: auto;
      }

      .steps {
        overflow: visible;
      }

      .action {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="field">
        <label for="ruleName">规则名称</label>
        <input id="ruleName" autocomplete="off" />
      </div>
      <div class="field">
        <label for="matchType">匹配方式</label>
        <select id="matchType">
          <option value="contains">包含</option>
          <option value="regex">正则</option>
        </select>
      </div>
      <div class="field">
        <label for="maxTriggers">最大触发次数</label>
        <input id="maxTriggers" type="number" min="0" step="1" />
      </div>
    </header>
    <main class="main">
      <section class="steps" id="steps"></section>
      <aside class="side">
        <div class="panel">
          <div class="panel-title">执行选项</div>
          <div class="checks">
            <label class="check"><input id="appendEnter" type="checkbox" />新动作默认追加 Enter</label>
            <label class="check"><input id="caseSensitive" type="checkbox" />匹配时区分大小写</label>
            <label class="check"><input id="once" type="checkbox" />命中后自动停用</label>
            <label class="check"><input id="allowStartupTrigger" type="checkbox" />连接启动阶段允许触发</label>
          </div>
          <div class="hint">绿色按钮表示规则当前启用；次数用完后会由主界面自动置灰。</div>
        </div>
        <div class="panel">
          <div class="panel-title">节流</div>
          <div class="num-grid">
            <div class="field">
              <label for="delayMs">新步骤间隔(ms)</label>
              <input id="delayMs" type="number" min="0" step="1" />
            </div>
            <div class="field">
              <label>&nbsp;</label>
              <button class="primary" id="addStep">添加步骤</button>
            </div>
          </div>
          <div class="hint">每个动作也可以设置独立等待时间，用于两个命令之间的延时。</div>
        </div>
        <div class="panel preview-entry">
          <div class="panel-title">流程预览</div>
          <div class="preview-summary" id="flowSummary">未生成流程</div>
          <button id="openFlowPreview">查看流程</button>
        </div>
      </aside>
    </main>
  </div>

  <div class="modal-backdrop" id="flowModal" aria-hidden="true">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="flowModalTitle">
      <div class="modal-head">
        <div class="modal-title" id="flowModalTitle">规则执行流程</div>
        <button id="closeFlowPreview">关闭</button>
      </div>
      <div class="modal-body">
        <div class="flow-preview" id="flowPreview"></div>
      </div>
    </section>
  </div>

  <template id="stepTemplate">
    <article class="step">
      <div class="step-head">
        <div class="step-index"></div>
        <div class="field">
          <label>如果终端出现</label>
          <input class="pattern" autocomplete="off" placeholder="例如 Password: / Ctrl+B / BOOT menu" />
        </div>
        <div class="field step-delay">
          <label>发送前等待(ms)</label>
          <input class="step-delay-input" type="number" min="0" step="1" />
        </div>
        <button class="danger remove-step">删除步骤</button>
      </div>
      <div class="actions"></div>
      <div class="btn-row" style="padding: 0 12px 12px 70px;">
        <button class="add-action">再发送一条</button>
      </div>
    </article>
  </template>

  <template id="actionTemplate">
    <div class="action">
      <div class="field">
        <label>发送到</label>
        <select class="target"></select>
      </div>
      <div class="field">
        <label>发送内容</label>
        <input class="text" autocomplete="off" placeholder="例如 admin / display version / Ctrl+B" />
      </div>
      <div class="field action-delay-field">
        <label>等待(ms)</label>
        <input class="delay" type="number" min="0" step="1" />
      </div>
      <label class="inline-check"><input class="append-enter" type="checkbox" />Enter</label>
      <button class="danger remove-action">删除</button>
    </div>
  </template>

  <script>
    let bridge = null;
    let state = null;

    const $ = (id) => document.getElementById(id);
    const stepsEl = $("steps");

    function normalizeState(payload) {
      const fallback = {
        name: "启动菜单 Ctrl+B",
        matchType: "contains",
        appendEnter: false,
        caseSensitive: true,
        once: true,
        allowStartupTrigger: false,
        delayMs: 0,
        maxTriggers: 0,
        targets: [{ label: "当前选中终端", value: "current" }],
        steps: [{ pattern: "Ctrl+B", responses: [{ text: "Ctrl+B", target: "current", delay: 0, appendEnter: false }] }]
      };
      const next = Object.assign(fallback, payload || {});
      if (!Array.isArray(next.targets) || next.targets.length === 0) next.targets = fallback.targets;
      if (!Array.isArray(next.steps) || next.steps.length === 0) next.steps = fallback.steps;
      next.steps = next.steps.map((step) => ({
        pattern: step && step.pattern ? String(step.pattern) : "",
        responses: Array.isArray(step && step.responses) && step.responses.length
          ? step.responses.map((response) => ({
              text: response && response.text ? String(response.text) : "",
              target: response && response.target ? String(response.target) : "current",
              delay: Number.parseInt(response && response.delay ? response.delay : 0, 10) || 0,
              appendEnter: !!(response && response.appendEnter)
            }))
          : [{ text: "", target: "current", delay: 0, appendEnter: !!next.appendEnter }]
      }));
      return next;
    }

    function collect() {
      return {
        name: $("ruleName").value,
        matchType: $("matchType").value,
        appendEnter: $("appendEnter").checked,
        caseSensitive: $("caseSensitive").checked,
        once: $("once").checked,
        allowStartupTrigger: $("allowStartupTrigger").checked,
        delayMs: 0,
        maxTriggers: Number.parseInt($("maxTriggers").value || "0", 10) || 0,
        targets: state.targets,
        steps: Array.from(document.querySelectorAll(".step")).map((stepEl) => ({
          pattern: stepEl.querySelector(".pattern").value,
          responses: Array.from(stepEl.querySelectorAll(".action")).map((actionEl, index) => ({
            target: actionEl.querySelector(".target").value,
            text: actionEl.querySelector(".text").value,
            delay: index === 0
              ? Number.parseInt(stepEl.querySelector(".step-delay-input").value || "0", 10) || 0
              : Number.parseInt(actionEl.querySelector(".delay").value || "0", 10) || 0,
            appendEnter: actionEl.querySelector(".append-enter").checked
          }))
        }))
      };
    }

    function sync() {
      state = collect();
      renderStepNumbers();
      renderFlowPreview();
      if (bridge) bridge.updatePayload(JSON.stringify(state));
    }

    function textOrPlaceholder(value, placeholder) {
      const text = String(value || "").trim();
      return text || placeholder;
    }

    function targetLabel(value) {
      const target = state.targets.find((item) => item.value === value);
      if (!target) return value || "当前终端";
      return target.label.replace(/^已打开：/, "");
    }

    function renderFlowPreview() {
      const preview = $("flowPreview");
      const summary = $("flowSummary");
      if (!preview || !state) return;
      preview.innerHTML = "";
      const steps = Array.isArray(state.steps) ? state.steps : [];
      const actionCount = steps.reduce((total, step) => {
        return total + (Array.isArray(step.responses) ? step.responses.length : 0);
      }, 0);
      if (summary) {
        summary.textContent = steps.length
          ? `${steps.length} 个步骤，${actionCount} 条发送动作`
          : "未生成流程";
      }
      if (!steps.length) {
        const empty = document.createElement("div");
        empty.className = "empty-flow";
        empty.textContent = "暂无步骤。添加步骤后这里会显示执行顺序。";
        preview.appendChild(empty);
        return;
      }
      steps.forEach((step, stepIndex) => {
        const stepEl = document.createElement("div");
        stepEl.className = "flow-step";

        const dot = document.createElement("div");
        dot.className = "flow-dot";
        stepEl.appendChild(dot);

        const title = document.createElement("div");
        title.className = "flow-title";
        const titleText = document.createElement("span");
        titleText.textContent = `第 ${stepIndex + 1} 步`;
        title.appendChild(titleText);
        const firstDelay = step.responses && step.responses[0]
          ? Number.parseInt(step.responses[0].delay || 0, 10) || 0
          : 0;
        if (firstDelay > 0) {
          const delay = document.createElement("span");
          delay.className = "flow-delay";
          delay.textContent = `等待 ${firstDelay}ms`;
          title.appendChild(delay);
        }
        stepEl.appendChild(title);

        const wait = document.createElement("div");
        wait.className = "flow-wait";
        wait.title = textOrPlaceholder(step.pattern, "未填写匹配输出");
        wait.textContent = `等待输出：${textOrPlaceholder(step.pattern, "未填写匹配输出")}`;
        stepEl.appendChild(wait);

        const actions = document.createElement("div");
        actions.className = "flow-actions";
        (Array.isArray(step.responses) ? step.responses : []).forEach((action, actionIndex) => {
          const actionEl = document.createElement("div");
          actionEl.className = "flow-action";

          const command = document.createElement("div");
          command.className = "flow-command";
          command.title = textOrPlaceholder(action.text, "未填写发送内容");
          command.textContent = `${actionIndex + 1}. ${textOrPlaceholder(action.text, "未填写发送内容")}`;
          actionEl.appendChild(command);

          const meta = document.createElement("div");
          meta.className = "flow-meta";
          const target = document.createElement("span");
          target.className = "flow-chip";
          target.title = targetLabel(action.target);
          target.textContent = targetLabel(action.target);
          meta.appendChild(target);
          const actionDelay = Number.parseInt(action.delay || 0, 10) || 0;
          if (actionIndex > 0 && actionDelay > 0) {
            const delay = document.createElement("span");
            delay.className = "flow-chip";
            delay.textContent = `${actionDelay}ms`;
            meta.appendChild(delay);
          }
          if (action.appendEnter) {
            const enter = document.createElement("span");
            enter.className = "flow-chip enter";
            enter.textContent = "Enter";
            meta.appendChild(enter);
          }
          actionEl.appendChild(meta);
          actions.appendChild(actionEl);
        });
        stepEl.appendChild(actions);
        preview.appendChild(stepEl);
      });
    }

    function fillTargets(select, selected) {
      select.innerHTML = "";
      state.targets.forEach((target) => {
        const option = document.createElement("option");
        option.value = target.value;
        option.textContent = target.label;
        select.appendChild(option);
      });
      select.value = selected || "current";
      if (select.value !== (selected || "current")) select.value = "current";
    }

    function refreshActionDelayFields(stepEl) {
      stepEl.querySelectorAll(".action").forEach((actionEl, index) => {
        const delayInput = actionEl.querySelector(".delay");
        actionEl.classList.toggle("first-action", index === 0);
        delayInput.disabled = index === 0;
        delayInput.title = index === 0 ? "第一条发送的等待时间在步骤标题里设置" : "";
      });
    }

    function addAction(stepEl, action) {
      const fragment = $("actionTemplate").content.cloneNode(true);
      const actionEl = fragment.querySelector(".action");
      fillTargets(actionEl.querySelector(".target"), action && action.target);
      actionEl.querySelector(".text").value = action && action.text ? action.text : "";
      actionEl.querySelector(".delay").value = action && action.delay ? action.delay : 0;
      actionEl.querySelector(".append-enter").checked = !!(action && action.appendEnter);
      if (stepEl.querySelectorAll(".action").length === 0) {
        actionEl.classList.add("first-action");
        actionEl.querySelector(".delay").disabled = true;
        actionEl.querySelector(".delay").title = "第一条发送的等待时间在步骤标题里设置";
      }
      actionEl.querySelector(".remove-action").addEventListener("click", () => {
        const actions = stepEl.querySelector(".actions");
        if (actions.querySelectorAll(".action").length <= 1) {
          actionEl.querySelector(".text").value = "";
          actionEl.querySelector(".delay").value = 0;
          actionEl.querySelector(".append-enter").checked = !!state.appendEnter;
        } else {
          actionEl.remove();
        }
        refreshActionDelayFields(stepEl);
        sync();
      });
      actionEl.querySelectorAll("input,select").forEach((node) => node.addEventListener("input", sync));
      actionEl.querySelectorAll("select").forEach((node) => node.addEventListener("change", sync));
      stepEl.querySelector(".actions").appendChild(fragment);
      refreshActionDelayFields(stepEl);
    }

    function addStep(step) {
      const fragment = $("stepTemplate").content.cloneNode(true);
      const stepEl = fragment.querySelector(".step");
      stepEl.querySelector(".pattern").value = step && step.pattern ? step.pattern : "";
      const firstActionDelay = step && step.responses && step.responses[0]
        ? Number.parseInt(step.responses[0].delay || 0, 10) || 0
        : 0;
      stepEl.querySelector(".step-delay-input").value = firstActionDelay;
      stepEl.querySelector(".pattern").addEventListener("input", sync);
      stepEl.querySelector(".step-delay-input").addEventListener("input", sync);
      stepEl.querySelector(".remove-step").addEventListener("click", () => {
        if (document.querySelectorAll(".step").length <= 1) {
          stepEl.querySelector(".pattern").value = "";
          stepEl.querySelector(".actions").innerHTML = "";
          addAction(stepEl, { text: "", target: "current", delay: 0, appendEnter: !!state.appendEnter });
        } else {
          stepEl.remove();
        }
        sync();
      });
      stepEl.querySelector(".add-action").addEventListener("click", () => {
        addAction(stepEl, { text: "", target: "current", delay: 0, appendEnter: !!state.appendEnter });
        sync();
      });
      (step && step.responses ? step.responses : [{ text: "", target: "current", delay: 0, appendEnter: !!state.appendEnter }]).forEach((action) => {
        addAction(stepEl, action);
      });
      stepsEl.appendChild(fragment);
      renderStepNumbers();
    }

    function renderStepNumbers() {
      document.querySelectorAll(".step").forEach((stepEl, index) => {
        stepEl.querySelector(".step-index").textContent = `第 ${index + 1} 步`;
      });
    }

    function render(payload) {
      state = normalizeState(payload);
      $("ruleName").value = state.name || "";
      $("matchType").value = state.matchType || "contains";
      $("appendEnter").checked = !!state.appendEnter;
      $("caseSensitive").checked = state.caseSensitive !== false;
      $("once").checked = state.once !== false;
      $("allowStartupTrigger").checked = !!state.allowStartupTrigger;
      $("delayMs").value = state.delayMs || 0;
      $("maxTriggers").value = state.maxTriggers || 0;
      stepsEl.innerHTML = "";
      state.steps.forEach(addStep);
      document.querySelectorAll("header input, header select, aside input, aside select").forEach((node) => {
        node.addEventListener("input", sync);
        node.addEventListener("change", sync);
      });
      $("openFlowPreview").addEventListener("click", () => {
        $("flowModal").classList.add("open");
        $("flowModal").setAttribute("aria-hidden", "false");
      });
      $("closeFlowPreview").addEventListener("click", closeFlowPreview);
      $("flowModal").addEventListener("click", (event) => {
        if (event.target === $("flowModal")) closeFlowPreview();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeFlowPreview();
      });
      $("addStep").addEventListener("click", () => {
        const stepDelay = Number.parseInt($("delayMs").value || "0", 10) || 0;
        addStep({ pattern: "", responses: [{ text: "", target: "current", delay: stepDelay, appendEnter: !!state.appendEnter }] });
        sync();
      });
      sync();
    }

    function closeFlowPreview() {
      $("flowModal").classList.remove("open");
      $("flowModal").setAttribute("aria-hidden", "true");
    }

    new QWebChannel(qt.webChannelTransport, (channel) => {
      bridge = channel.objects.autoResponseBridge;
      bridge.initialPayload((payload) => render(JSON.parse(payload || "{}")));
    });
  </script>
</body>
</html>
