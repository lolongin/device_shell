[project]
name = "device-tui"
version = "0.1.0"
description = "Python backend and device services for the Electron device dashboard."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "asyncssh>=2.22,<3",
    "fastapi>=0.135,<1",
    "mcp>=1.27,<2",
    "keyring>=25,<26",
    "telnetlib3>=4.0,<5",
    "uvicorn>=0.46,<1",
    "websockets>=15,<17",
    "pyftpdlib>=2.0,<3",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
packaging = [
    "pyinstaller>=6,<7",
]

[project.scripts]
device-tui-backend = "device_tui.interfaces.desktop_api.main:main"
device-tui-mcp = "device_tui.interfaces.mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["device_tui*"]

[tool.setuptools.package-data]
"device_tui.application.ai.gateway" = ["skills/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
