<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self' https://cdn.jsdelivr.net qrc: data: blob:; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net qrc:; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;"
  >
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>xterm terminal</title>
  <link rel="stylesheet" href="assets/workspace-theme.css">
  <link rel="stylesheet" href="assets/xterm.css" onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css';">
  <style>
    html,
    body {
      height: 100%;
      min-height: 0;
    }

    #terminal {
      width: 100%;
      height: 100%;
      min-height: 0;
      box-sizing: border-box;
      overflow: hidden;
      background: var(--bg);
    }

    #terminal-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 0;
      padding: 8px 10px 14px 10px;
      box-sizing: border-box;
      background: var(--bg);
    }

    #terminal-suggestion {
      position: absolute;
      display: none;
      pointer-events: none;
      z-index: 20;
      color: var(--terminal-suggestion);
      font: 700 14px/1 "Cascadia Mono", "JetBrains Mono", "Fira Code", Consolas, monospace;
      white-space: pre;
      text-shadow: 0 0 8px var(--bg);
    }

    .xterm {
      padding: 0;
    }

    .xterm .xterm-viewport {
      background-color: transparent;
      scrollbar-color: var(--line-strong) var(--input);
      scrollbar-width: thin;
    }

    .xterm .xterm-viewport::-webkit-scrollbar {
      width: 10px;
    }

    .xterm .xterm-viewport::-webkit-scrollbar-track {
      background: var(--input);
    }

    .xterm .xterm-viewport::-webkit-scrollbar-thumb {
      background: var(--line-strong);
      border: 2px solid var(--input);
      border-radius: 999px;
    }

    .xterm .xterm-viewport::-webkit-scrollbar-thumb:hover {
      background: var(--scroll-hover);
    }


    #fallback {
      display: none;
      color: var(--text);
      padding: 16px;
      font: 13px/1.5 "Cascadia Mono", Consolas, monospace;
      white-space: pre-wrap;
    }
  </style>
</head>
<body class="workspace-terminal-page">
  <div id="terminal-wrap">
    <div id="terminal"></div>
    <div id="terminal-suggestion"></div>
  </div>
  <div id="fallback">xterm.js failed to load. Put xterm.js, xterm.css, and addon-fit.js in src/web/assets, or allow CDN access.</div>

  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script>
    const DEFAULT_FONT_SIZE = 14;
    const MIN_FONT_SIZE = 9;
    const MAX_FONT_SIZE = 28;
    const MIN_FIT_WIDTH = 240;
    const MIN_FIT_HEIGHT = 120;
    const localScripts = [
      'assets/xterm.js',
      'assets/addon-fit.js'
    ];
    const cdnScripts = [
      'https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js',
      'https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js'
    ];

    // Pushes the active workspace theme (dark/light) onto the :root CSS
    // variables. Only base tokens are overridden — the terminal ANSI tokens
    // (--terminal-ansi-*) must stay dark. In light mode the xterm theme is
    // rebuilt from the updated variables; dark mode reverts to the CSS :root.
    window.setWorkspaceTheme = function setWorkspaceTheme(theme) {
      const isLight = theme === 'light';
      const lightVars = {
        '--bg': '#f2f4f6',
        '--text': '#1c2128',
        '--accent': '#1f8a4c',
        '--muted': '#5a6470',
        '--danger': '#c74a4a',
        '--warn': '#b7791f',
        '--blue': '#3a7ecf',
        '--text-selection-bg': '#3a7ecf'
      };
      const root = document.documentElement;
      for (const key in lightVars) {
        if (isLight) {
          root.style.setProperty(key, lightVars[key]);
        } else {
          root.style.removeProperty(key);
        }
      }
      // Rebuild the xterm theme from the (possibly updated) CSS variables.
      if (window.term) {
        window.term.options.theme = Object.assign({}, window.term.options.theme, {
          background: cssVar('--bg'),
          foreground: cssVar('--text'),
          cursor: cssVar('--accent'),
          cursorAccent: cssVar('--bg'),
          selectionBackground: cssVar('--text-selection-bg'),
          selectionForeground: cssVar('--text-selection-fg'),
          red: cssVar('--danger'),
          green: cssVar('--accent'),
          yellow: cssVar('--warn'),
          blue: cssVar('--blue')
        });
        window.term.refresh(0, window.term.rows - 1);
      }
    };

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = src;
        script.onload = resolve;
        script.onerror = reject;
        document.head.appendChild(script);
      });
    }

    async function loadTerminalScripts() {
      for (let index = 0; index < localScripts.length; index += 1) {
        try {
          await loadScript(localScripts[index]);
        } catch (_error) {
          for (let cdnIndex = index; cdnIndex < cdnScripts.length; cdnIndex += 1) {
            await loadScript(cdnScripts[cdnIndex]);
          }
          return;
        }
      }
    }

    function makeFitAddon() {
      if (window.FitAddon && window.FitAddon.FitAddon) {
        return new window.FitAddon.FitAddon();
      }
      if (window.FitAddon) {
        return new window.FitAddon();
      }
      return null;
    }

    function runWhenReady(callback) {
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', callback, { once: true });
      } else {
        callback();
      }
    }

    function cssVar(name) {
      const value = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      return value;
    }

    runWhenReady(async () => {
      try {
        await loadTerminalScripts();
      } catch (error) {
        document.getElementById('fallback').style.display = 'block';
        return;
      }

      const term = new window.Terminal({
        allowProposedApi: true,
        cursorBlink: true,
        cursorStyle: 'block',
        convertEol: true,
        allowTransparency: false,
        fontFamily: '"Cascadia Mono", "JetBrains Mono", "Fira Code", Consolas, monospace',
        fontSize: DEFAULT_FONT_SIZE,
        fontWeight: 400,
        fontWeightBold: 600,
        lineHeight: 1.18,
        letterSpacing: 0,
        scrollback: 5000,
        scrollSensitivity: 1,
        fastScrollSensitivity: 4,
        theme: {
          background: cssVar('--bg'),
          foreground: cssVar('--text'),
          cursor: cssVar('--accent'),
          cursorAccent: cssVar('--bg'),
          selectionBackground: cssVar('--text-selection-bg'),
          selectionForeground: cssVar('--text-selection-fg'),
          black: cssVar('--soft'),
          red: cssVar('--danger'),
          green: cssVar('--accent'),
          yellow: cssVar('--warn'),
          blue: cssVar('--blue'),
          magenta: cssVar('--terminal-ansi-magenta'),
          cyan: cssVar('--terminal-ansi-cyan'),
          white: cssVar('--text'),
          brightBlack: cssVar('--muted'),
          brightRed: cssVar('--terminal-ansi-bright-red'),
          brightGreen: cssVar('--terminal-ansi-bright-green'),
          brightYellow: cssVar('--terminal-ansi-bright-yellow'),
          brightBlue: cssVar('--terminal-ansi-bright-blue'),
          brightMagenta: cssVar('--terminal-ansi-bright-magenta'),
          brightCyan: cssVar('--terminal-ansi-bright-cyan'),
          brightWhite: cssVar('--terminal-ansi-bright-white')
        }
      });
      const terminalWrapElement = document.getElementById('terminal-wrap');
      const terminalElement = document.getElementById('terminal');
      const suggestionElement = document.getElementById('terminal-suggestion');
      const fitAddon = makeFitAddon();
      if (fitAddon) {
        term.loadAddon(fitAddon);
      }
      term.open(terminalElement);
      // Expose the terminal instance so window.setWorkspaceTheme can rebuild
      // its theme and re-render when the workspace theme switches.
      window.term = term;

      let bridge = null;
      let ready = false;
      let pendingFitFrame = 0;
      let fitRetryTimer = 0;
      let activeSuggestion = '';
      let activeSuggestionPrefix = '';
      let completionLineCaptureTimer = 0;
      let completionLineCaptureUntil = 0;
      const semanticTokenPattern = /\b(error|failed?|failure|fatal|critical|success|succeeded|pass(?:ed)?|ok|done|warn(?:ing)?|caution|timeout|info|notice|debug|trace)\b/ig;
      const semanticTokenColors = {
        error: '\x1b[91m',
        fail: '\x1b[91m',
        failed: '\x1b[91m',
        failure: '\x1b[91m',
        fatal: '\x1b[91m',
        critical: '\x1b[91m',
        success: '\x1b[92m',
        succeeded: '\x1b[92m',
        pass: '\x1b[92m',
        passed: '\x1b[92m',
        ok: '\x1b[92m',
        done: '\x1b[92m',
        warn: '\x1b[93m',
        warning: '\x1b[93m',
        caution: '\x1b[93m',
        timeout: '\x1b[93m',
        info: '\x1b[94m',
        notice: '\x1b[94m',
        debug: '\x1b[94m',
        trace: '\x1b[94m'
      };
      const semanticTokenReset = '\x1b[39m';

      function colorizeSemanticTokens(data) {
        if (!data || data.indexOf('\x1b') >= 0) {
          return data;
        }
        semanticTokenPattern.lastIndex = 0;
        return data.replace(semanticTokenPattern, (token) => {
          const color = semanticTokenColors[token.toLowerCase()];
          return color ? `${color}${token}${semanticTokenReset}` : token;
        });
      }

      function hasUsableTerminalSize() {
        const rect = terminalWrapElement.getBoundingClientRect();
        return rect.width >= MIN_FIT_WIDTH && rect.height >= MIN_FIT_HEIGHT;
      }

      function fitAndNotify() {
        if (!hasUsableTerminalSize()) {
          window.clearTimeout(fitRetryTimer);
          fitRetryTimer = window.setTimeout(fitAndNotify, 80);
          return;
        }
        window.clearTimeout(fitRetryTimer);
        if (fitAddon) {
          fitAddon.fit();
        }
        positionSuggestion();
        if (bridge && term.cols && term.rows) {
          bridge.resize(term.cols, term.rows);
        }
      }

      function scheduleFitAndNotify() {
        if (pendingFitFrame) {
          return;
        }
        pendingFitFrame = window.requestAnimationFrame(() => {
          pendingFitFrame = 0;
          fitAndNotify();
        });
      }

      function commandSuggestionSuffix(suggestion, prefix) {
        if (!suggestion || !prefix) {
          return '';
        }
        if (suggestion.toLocaleLowerCase().startsWith(prefix.toLocaleLowerCase())) {
          return suggestion.slice(prefix.length);
        }
        return '';
      }

      function positionSuggestion() {
        if (!activeSuggestion) {
          return;
        }
        const dimensions = term._core && term._core._renderService
          ? term._core._renderService.dimensions.css
          : null;
        const cell = dimensions && dimensions.cell;
        if (!cell || !cell.width || !cell.height) {
          suggestionElement.style.left = '12px';
          suggestionElement.style.top = '10px';
          return;
        }
        const computed = window.getComputedStyle(terminalWrapElement);
        const paddingLeft = Number.parseFloat(computed.paddingLeft) || 0;
        const paddingTop = Number.parseFloat(computed.paddingTop) || 0;
        const buffer = term.buffer.active;
        suggestionElement.style.left = `${paddingLeft + buffer.cursorX * cell.width}px`;
        suggestionElement.style.top = `${paddingTop + buffer.cursorY * cell.height + 1}px`;
        suggestionElement.style.fontSize = `${term.options.fontSize}px`;
        suggestionElement.style.lineHeight = `${cell.height}px`;
      }

      function setSuggestion(suggestion, prefix) {
        const suffix = commandSuggestionSuffix(suggestion, prefix);
        activeSuggestion = suffix;
        activeSuggestionPrefix = prefix || '';
        if (!suffix) {
          clearSuggestion();
          return;
        }
        suggestionElement.textContent = suffix;
        suggestionElement.style.display = 'block';
        positionSuggestion();
      }

      function clearSuggestion() {
        activeSuggestion = '';
        activeSuggestionPrefix = '';
        suggestionElement.textContent = '';
        suggestionElement.style.display = 'none';
      }

      function shouldClearSuggestionForData(data) {
        if (!data) {
          return false;
        }
        if (data === '\r' || data === '\n' || data === '\t' || data === '\x7f') {
          return true;
        }
        if (data.indexOf('\x1b') >= 0) {
          return true;
        }
        return false;
      }

      function setTerminalFontSize(fontSize) {
        const nextSize = Math.max(MIN_FONT_SIZE, Math.min(MAX_FONT_SIZE, Math.round(fontSize)));
        if (term.options.fontSize === nextSize) {
          return;
        }
        term.options.fontSize = nextSize;
        fitAndNotify();
      }

      function adjustTerminalFontSize(delta) {
        setTerminalFontSize(term.options.fontSize + delta);
      }

      window.deviceTerminal = {
        write(data) {
          term.write(colorizeSemanticTokens(data));
        },
        clear() {
          term.clear();
        },
        focus() {
          term.focus();
        },
        scrollToLiveInput() {
          term.clearSelection();
          term.scrollToBottom();
        },
        fit() {
          fitAndNotify();
        },
        setSuggestion(suggestion, prefix) {
          setSuggestion(suggestion, prefix);
        },
        clearSuggestion() {
          clearSuggestion();
        },
        copySelection() {
          const selection = term.getSelection();
          if (selection) {
            navigator.clipboard.writeText(selection);
          }
        },
        copyAll() {
          const buffer = term.buffer.active;
          const lines = [];
          for (let index = 0; index < buffer.length; index += 1) {
            lines.push(buffer.getLine(index).translateToString(true));
          }
          navigator.clipboard.writeText(lines.join('\n').replace(/\s+$/g, ''));
        },
        dimensions() {
          return { cols: term.cols, rows: term.rows };
        },
        setFontSize(fontSize) {
          setTerminalFontSize(fontSize);
        },
        debugColorizedText(text) {
          return colorizeSemanticTokens(text);
        }
      };

      function writeClipboardText(text) {
        if (!text || !bridge) {
          return;
        }
        bridge.copyText(text);
      }

      function currentTerminalLineText() {
        try {
          const buffer = term.buffer.active;
          const line = buffer.getLine(buffer.baseY + buffer.cursorY);
          return line ? line.translateToString(true) : '';
        } catch (_error) {
          return '';
        }
      }

      function captureCompletionLine() {
        if (bridge) {
          bridge.cacheCompletionLine(currentTerminalLineText());
        }
        if (Date.now() < completionLineCaptureUntil) {
          completionLineCaptureTimer = window.setTimeout(captureCompletionLine, 80);
          return;
        }
        completionLineCaptureTimer = 0;
      }

      function scheduleCompletionLineCapture() {
        completionLineCaptureUntil = Date.now() + 1200;
        if (!completionLineCaptureTimer) {
          completionLineCaptureTimer = window.setTimeout(captureCompletionLine, 30);
        }
      }

      term.attachCustomKeyEventHandler((event) => {
        if (event.type !== 'keydown') {
          return true;
        }
        const key = event.key.toLowerCase();
        const ctrl = event.ctrlKey || event.metaKey;
        const shift = event.shiftKey;

        if (ctrl && shift && key === 'c') {
          writeClipboardText(term.getSelection());
          event.preventDefault();
          return false;
        }

        if (ctrl && key === 'c') {
          const selection = term.getSelection();
          if (selection) {
            writeClipboardText(selection);
            event.preventDefault();
            return false;
          }
          return true;
        }

        if ((ctrl && key === 'v') || (shift && event.key === 'Insert')) {
          if (bridge) {
            bridge.pasteFromClipboard();
          }
          event.preventDefault();
          return false;
        }

        if (ctrl && key === '0') {
          setTerminalFontSize(DEFAULT_FONT_SIZE);
          event.preventDefault();
          return false;
        }

        if (!ctrl && !shift && event.key === 'ArrowRight' && activeSuggestion) {
          if (bridge) {
            bridge.sendData(activeSuggestion);
          }
          clearSuggestion();
          event.preventDefault();
          return false;
        }

        if (
          activeSuggestion
          && (
            event.key === 'ArrowUp'
            || event.key === 'ArrowDown'
            || event.key === 'ArrowLeft'
            || event.key === 'Home'
            || event.key === 'End'
            || event.key === 'Tab'
            || event.key === 'Enter'
            || event.key === 'Escape'
            || event.key === 'Backspace'
            || event.key === 'Delete'
          )
        ) {
          clearSuggestion();
        }

        return true;
      });

      window.addEventListener('wheel', (event) => {
        if (!event.ctrlKey && !event.metaKey) {
          return;
        }
        event.preventDefault();
        adjustTerminalFontSize(event.deltaY < 0 ? 1 : -1);
      }, { passive: false });

      term.onData((data) => {
        if (shouldClearSuggestionForData(data)) {
          clearSuggestion();
        }
        if (bridge) {
          if (data === '\r' || data === '\n') {
            bridge.sendDataWithLine(data, currentTerminalLineText());
          } else if (data === '\t') {
            bridge.sendData(data);
            scheduleCompletionLineCapture();
          } else {
            bridge.sendData(data);
          }
        }
      });
      term.onRender(() => {
        positionSuggestion();
      });
      term.onResize((size) => {
        if (bridge) {
          bridge.resize(size.cols, size.rows);
        }
      });

      const resizeObserver = window.ResizeObserver
        ? new ResizeObserver(scheduleFitAndNotify)
        : null;
      if (resizeObserver) {
        resizeObserver.observe(terminalWrapElement);
      }
      window.addEventListener('resize', scheduleFitAndNotify);
      setTimeout(scheduleFitAndNotify, 0);

      new QWebChannel(qt.webChannelTransport, (channel) => {
        bridge = channel.objects.terminalBridge;
        ready = true;
        fitAndNotify();
        bridge.ready();
        term.focus();
      });
    });
  </script>
</body>
</html>
